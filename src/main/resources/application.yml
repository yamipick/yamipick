server:
  port: 8080

spring:
  application:
    name: yamipick
  
  # 1. JDBC 설정 (경로 수정 필수!)
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    # ▼ [수정됨] C:/dev/... 지우고 /app/wallet으로 변경!
    url: jdbc:oracle:thin:@llgabbhp32n2794c_medium?TNS_ADMIN=/app/wallet
    username: ${DB_USERNAME}  # .env에서 가져옴
    password: ${DB_PASSWORD}  # .env에서 가져옴
    
    hikari:
      maximum-pool-size: 3
      connection-timeout: 6000
      idle-timeout: 600000 

  # 2. JPA 설정
  jpa:
    database: oracle
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  # 3. AWS S3 설정 (변수 처리)
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY} # .env에서 가져옴
        secret-key: ${AWS_SECRET_KEY} # .env에서 가져옴
      s3:
        bucket: yamipick-bucket
      region:
        static: ap-northeast-2
      stack:
        auto: false

  # 4. 파일 업로드
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 5. 커스텀 API 키 설정 (전부 변수로 변경)
yamipick:
  api:
    naver:
      client-id: ${NAVER_CLIENT_ID}
      client-secret: ${NAVER_CLIENT_SECRET}
    kakao:
      key: ${KAKAO_REST_API_KEY}
      js-key: ${KAKAO_JS_KEY}
    weather:
      key: ${WEATHER_API_KEY}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: "gemini-flash-latest"

pexels:
  api-key: ${PEXELS_API_KEY}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:  
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
    com.project.yamipick: debug
    
holiday:
  api:
    service-key: ${HOLIDAY_API_KEY}