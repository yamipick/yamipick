  # 3. Thymeleaf 설정
  thymeleaf:
    cache: false

# 4. MyBatis 설정
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 5. 로깅 설정
logging:
  level:
    root: info
    com.test: debug # 본인 패키지명
    org.hibernate.SQL: debug # 하이버네이트 쿼리 로그
    org.hibernate.type.descriptor.sql.BasicBinder: trace # 바인딩 변수(값) 확인용