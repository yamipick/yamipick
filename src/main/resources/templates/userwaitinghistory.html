<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 웨이팅 기록</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; padding: 20px; text-align: center; max-width: 420px; margin: 0 auto; background-color: #f1f2f6; color: #333; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); min-height: 500px; position: relative; }
        
        h2 { margin-top: 10px; color: #2d3436; }
        
        /* 리스트 스타일 */
        .history-list { list-style: none; padding: 0; margin-top: 20px; text-align: left; }
        .h-item { background: #fff; border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        
        .h-info { display: flex; flex-direction: column; gap: 4px; }
        .h-store { font-weight: bold; font-size: 1.1em; color: #2d3436; }
        .h-date { font-size: 0.85em; color: #b2bec3; }
        .h-meta { font-size: 0.9em; color: #636e72; }

        .h-status { font-weight: bold; padding: 6px 10px; border-radius: 8px; font-size: 0.85em; }
        .st-ENTERED { background: #dff9fb; color: #00b894; }
        .st-CANCELED { background: #ffeaa7; color: #d63031; }
        .st-WAITING { background: #74b9ff; color: white; }

        /* 뒤로가기 버튼 */
        .btn-back { display: block; width: 100%; padding: 15px; background: #636e72; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 1.1em; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📂 나의 웨이팅 히스토리</h2>
        <p style="color:#aaa; font-size:0.9em;">최근 방문 기록을 확인하세요.</p>
        
        <ul id="list-area" class="history-list">
            <li style="text-align:center; margin-top:50px; color:#ccc;">로딩 중...</li>
        </ul>

        <button class="btn-back" onclick="location.href='/waitinguser'">⬅️ 메인으로 돌아가기</button>
    </div>

    <script>
        // 실제로는 로그인 세션에서 ID를 가져와야 합니다. 
        // 테스트를 위해 로컬스토리지나 URL 파라미터를 쓰거나, 여기서는 1번으로 고정합니다.
        // (기존 userwaiting.html에서 userId를 1로 테스트하셨으므로 동일하게 1 사용)
        const userId = 1; 

        window.onload = function() {
            fetch(`/waiting/history?userId=${userId}`)
                .then(res => res.json())
                .then(list => {
                    const ul = document.getElementById('list-area');
                    ul.innerHTML = "";

                    if (list.length === 0) {
                        ul.innerHTML = "<li style='text-align:center; margin-top:50px; color:#aaa;'>방문 기록이 없습니다.</li>";
                        return;
                    }

                    list.forEach(item => {
                        let statusText = item.status;
                        if(item.status === 'ENTERED') statusText = '입장완료';
                        else if(item.status === 'CANCELED') statusText = '취소됨';
                        else if(item.status === 'WAITING') statusText = '대기중';

                        ul.innerHTML += `
                            <li class="h-item">
                                <div class="h-info">
                                    <span class="h-store">🍽️ ${item.storeName || '알 수 없는 매장'}</span>
                                    <span class="h-meta">${item.teamSize}명 • 대기번호 ${item.waitingNumber}번</span>
                                    <span class="h-date">${item.regDate}</span>
                                </div>
                                <div class="h-status st-${item.status}">
                                    ${statusText}
                                </div>
                            </li>
                        `;
                    });
                })
                .catch(err => {
                    document.getElementById('list-area').innerHTML = "<li style='text-align:center; color:red;'>불러오기 실패</li>";
                });
        };
    </script>
</body>
</html>
