<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamipick 웨이팅</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8f9fa; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 20px; color: #333; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background-color: #ff6b6b; color: white; }
        .btn-primary:hover { background-color: #ee5253; }
        .btn-cancel { background-color: #636e72; color: white; margin-top: 10px; }
        
        /* 대기 화면 스타일 */
        #status-screen { display: none; }
        .waiting-number { font-size: 3em; font-weight: bold; color: #ff6b6b; margin: 20px 0; }
        .info-text { font-size: 1.2em; color: #555; }
        .count-text { font-weight: bold; color: #ff9f43; font-size: 1.5em; }
        
        /* 알림 박스 */
        #notice-box, #msg-area { display: none; padding: 15px; margin-bottom: 15px; border-radius: 8px; text-align: left; font-size: 0.9em; }
        #notice-box { background-color: #2d3436; color: #ffeaa7; }
        #msg-area { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="register-screen" class="container">
        <h2>🍽️ 맛집 줄서기</h2>
        <p style="color:#888; font-size:0.9em;">현재 로그인: 테스터(ID:1)</p>
        
        <input type="number" id="size" placeholder="인원 수 (명)" value="2">
        <button class="btn-primary" onclick="register()">웨이팅 등록하기</button>
    </div>

    <div id="status-screen" class="container">
        <div id="notice-box">📢 <b>공지:</b> <span id="notice-text"></span></div>
        
        <div id="msg-area"></div>

        <h2>나의 대기 번호</h2>
        <div class="waiting-number" id="my-id"></div>
        
        <div class="info-text">
            내 앞 <span id="remain-cnt" class="count-text">0</span>팀 대기 중
        </div>
        
        <div style="margin-top: 30px; font-size: 0.8em; color: #aaa;">
            잠시만 기다려주세요.<br>호출 시 알림을 보내드립니다.
        </div>

        <button class="btn-cancel" onclick="cancelWaiting()">웨이팅 취소</button>
    </div>

    <script>
        let myId = null;
        let socket = null;

        // 1. 웨이팅 등록 (POST)
        function register() {
            const userId = 1; // 더미 데이터 (로그인 했다고 가정)
            const size = document.getElementById('size').value;

            // POST 요청 (쿼리 파라미터 방식)
            fetch(`/waiting/register?userId=${userId}&size=${size}`, { 
                method: 'POST' 
            })
            .then(res => {
                if (!res.ok) throw new Error("등록 실패");
                return res.json();
            })
            .then(data => {
                // 등록 성공 시 처리
                myId = data.id;
                
                // 화면 전환
                document.getElementById('register-screen').style.display = 'none';
                document.getElementById('status-screen').style.display = 'block';
                document.getElementById('my-id').innerText = myId + "번";

                // 기능 시작
                connectWs();        // 소켓 연결
                updateRemainCount(); // 순번 확인
            })
            .catch(err => alert("등록 중 오류가 발생했습니다."));
        }

        // 2. 내 순번 확인 (GET)
        function updateRemainCount() {
            // ★ 방어 코드: ID가 없으면 요청하지 않음 (404 에러 방지)
            if (!myId) return;

            fetch(`/waiting/check/${myId}`)
                .then(res => res.text())
                .then(cnt => {
                    document.getElementById('remain-cnt').innerText = cnt;
                });
        }

        // 3. 웹소켓 연결
        function connectWs() {
            if (!myId) return;

            socket = new WebSocket("ws://localhost:8080/ws/waiting");
            
            socket.onopen = () => {
                console.log("서버 접속 완료");
                // 내 번호 신고
                socket.send(JSON.stringify({ waitingId: myId }));
            };

            socket.onmessage = (msg) => {
                const text = msg.data;
                console.log("알림 도착:", text);

                // 메시지 종류별 처리
                if (text.startsWith("NOTICE:")) {
                    // 공지사항
                    document.getElementById('notice-text').innerText = text.split(":")[1];
                    document.getElementById('notice-box').style.display = 'block';
                } 
                else if (text.startsWith("CALL:")) {
                    // 호출 알림
                    const message = text.split(":")[1];
                    const msgArea = document.getElementById('msg-area');
                    msgArea.innerText = "🔔 " + message;
                    msgArea.style.display = 'block';
                    alert("🔔 " + message);
                } 
                else if (text.startsWith("ENTER:")) {
                    // 입장 완료
                    alert("✅ 입장이 확인되었습니다. 이용해 주셔서 감사합니다.");
                    location.reload(); // 새로고침해서 초기화
                }

                // 메시지가 올 때마다 앞 팀 수 갱신 (누군가 빠졌을 테니)
                updateRemainCount();
            };
        }

        // 4. 취소하기 (POST)
        function cancelWaiting() {
            if(!confirm("정말 취소하시겠습니까?")) return;

            fetch(`/waiting/cancel/${myId}`, { method: 'POST' })
                .then(() => {
                    alert("취소되었습니다.");
                    location.reload();
                });
        }

        // 5초마다 순번 자동 갱신 (폴링)
        setInterval(updateRemainCount, 5000);

    </script>
</body>
</html>
