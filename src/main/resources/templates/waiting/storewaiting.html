<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>웨이팅 관리</title>
    <style>
        /* -------------------------------------------------------
           YamiPick Theme: Warm Choco & Cream (지도 디자인 통일)
        ------------------------------------------------------- */
        :root {
            --primary: #6D4C41;   /* 진한 갈색 (메인) */
            --primary-hover: #5D4037;
            --secondary: #8D6E63; /* 부드러운 라떼색 (보조) */
            --bg-body: #F5F5F5;   /* 웜 그레이 배경 */
            --text-main: #3E2723; /* 고동색 텍스트 */
            --danger: #E57373;    /* 삭제/취소 (부드러운 빨강) */
            --warning: #FFB74D;   /* 경고/호출 (오렌지) */
            --border: #D7CCC8;    /* 연한 갈색 테두리 */
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            padding: 20px; 
            
            /* ★ 핵심: 고정 헤더(60px) + 여백(20px) 확보 */
            padding-top: 80px; 
        }

        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 15px; /* 더 둥글게 */
            box-shadow: 0 4px 20px rgba(109, 76, 65, 0.08); /* 은은한 갈색 그림자 */
        }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            padding-bottom: 15px; 
            border-bottom: 2px solid #EFEBE9; 
        }
        h1 { margin: 0; color: var(--primary); font-size: 1.8em; letter-spacing: -1px; }

        /* 토글 버튼 스타일 */
        .btn-toggle { padding: 10px 20px; font-weight: bold; border: none; border-radius: 20px; cursor: pointer; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .on { background-color: var(--primary); color: white; } 
        .off { background-color: #BCAAA4; color: white; }

        /* 섹션 박스 스타일 */
        .section-box { background: #FAFAFA; padding: 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #EFEBE9; }
        .section-title { margin: 0; font-size: 1.1em; color: var(--text-main); font-weight: bold; display: flex; align-items: center; gap: 8px; }

        /* 입력 필드 스타일 */
        input[type="text"], textarea, input[type="time"] { 
            padding: 12px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-family: inherit; 
            transition: 0.2s; 
            outline: none;
            background-color: #fff;
        }
        input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(109, 76, 65, 0.1); }
        
        .btn-action { background-color: var(--primary); color: white; padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-action:hover { background-color: var(--primary-hover); transform: translateY(-1px); }

        /* ★ 공지 목록 스타일 (버튼 가로 배치) */
        #manager-notice-list { list-style: none; padding: 0; margin: 0; background: white; border: 1px solid #EFEBE9; border-radius: 8px; }
        #manager-notice-list li { 
            padding: 20px;
            border-bottom: 1px solid #EFEBE9; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; /* 상단 정렬 */
        }
        #manager-notice-list li:last-child { border-bottom: none; }
        
        .notice-content-area { flex: 1; padding-right: 20px; text-align: left; }

        /* 버튼 그룹 가로 배치 */
        .notice-btn-group { 
            display: flex; 
            gap: 8px; /* 버튼 사이 간격 */
            align-items: flex-start;
        }
        .notice-btn-group button { 
            font-size: 0.85em; 
            padding: 8px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            border: none; 
            font-weight: bold;
            color: white;
            transition: 0.2s;
        }
        .btn-edit { background-color: var(--secondary); } 
        .btn-edit:hover { background-color: var(--primary); }
        .btn-del { background-color: var(--danger); }
        .btn-del:hover { background-color: #D32F2F; }
        
        /* 대기 목록 테이블 */
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 15px; background: white; border-radius: 10px; overflow: hidden; border: 1px solid #EFEBE9; }
        th { background-color: var(--primary); color: white; padding: 15px; font-weight: 600; text-transform: uppercase; font-size: 0.9em; } 
        td { border-bottom: 1px solid #EFEBE9; padding: 15px; text-align: center; color: #4E342E; font-size: 0.95em; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #FFF8E1; /* 호버시 아주 연한 크림색 */ }

        .btn-refresh { background-color: var(--secondary); color: white; float: right; margin-bottom: 10px; padding: 8px 16px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); } 
        
        /* 테이블 내부 버튼 */
        .btn-call { background-color: var(--warning); color: #3E2723; padding: 6px 12px; border-radius: 6px; border:none; cursor:pointer; font-weight:bold;} 
        .btn-enter { background-color: var(--primary); color: white; padding: 6px 12px; border-radius: 6px; border:none; cursor:pointer; font-weight:bold;} 
        .btn-reject { background-color: #BCAAA4; color: white; padding: 6px 12px; border-radius: 6px; border:none; cursor:pointer; font-weight:bold;} 
        
        /* 웨이팅 상태 뱃지 */
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.85em; font-weight: bold;}
        .status-WAITING { background-color: #EFEBE9; color: var(--primary); border: 1px solid #D7CCC8; } 
        .status-CALLED { background-color: #FFCCBC; color: #D84315; animation: blink 1s infinite; }
        
        /* 로그 컨테이너 */
        #log-container { background: #202020; color: #EFEBE9; border-radius: 8px;}

        @keyframes blink { 50% { opacity: 0.7; } }
    </style>
</head>
<body>
<div th:replace="~{common/header :: headerFragment}"></div>
    <div class="container">
        <div class="header">
            <h1>웨이팅 관리</h1>
            <button id="btn-status" class="btn-toggle on" onclick="toggleStatus()">접수 중</button>
        </div>
        
        <div class="section-box" style="background: #FFF8E1; border-color: #FFE082;">
            <h3 class="section-title" style="color:#F57F17; margin-bottom: 15px;">🔔 알림 전송</h3>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="ws-content" placeholder="예: 재료 소진으로 마감합니다." style="flex: 1; border: 1px solid #FFE082;">
                <button class="btn-action" style="background:#FBC02D; color:#3E2723;" onclick="sendWsNotice()">전송</button>
            </div>
        </div>
        
        <div class="section-box">
            <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleSchedule()">
                <h3 class="section-title">⏰ 영업 시간 설정</h3>
                <span id="s-arrow">🔽</span>
            </div>

            <div id="schedule-body" style="display:none; margin-top: 15px;">
                <div style="background: #fff; padding: 20px; border: 1px solid #EFEBE9; border-radius: 10px;">
                    
                    <div style="margin-bottom: 20px;">
                        <span style="font-weight:bold; margin-right: 15px; color: var(--primary);">요일 선택</span>
                        <label style="margin-right:10px;"><input type="checkbox" name="days" value="1" checked> 월</label>
                        <label style="margin-right:10px;"><input type="checkbox" name="days" value="2" checked> 화</label>
                        <label style="margin-right:10px;"><input type="checkbox" name="days" value="3" checked> 수</label>
                        <label style="margin-right:10px;"><input type="checkbox" name="days" value="4" checked> 목</label>
                        <label style="margin-right:10px;"><input type="checkbox" name="days" value="5" checked> 금</label>
                        <label style="margin-right:10px;"><input type="checkbox" name="days" value="6"> 토</label>
                        <label><input type="checkbox" name="days" value="0"> 일</label>
                    </div>

                    <div style="display: flex; gap: 20px; flex-wrap: wrap; align-items: center; margin-bottom: 20px;">
                        <div>
                            <div style="font-size: 0.9em; color: var(--secondary); margin-bottom: 4px;">오픈 시간</div>
                            <input type="time" id="sch-open" value="10:00">
                        </div>
                        <div>
                            <div style="font-size: 0.9em; color: var(--secondary); margin-bottom: 4px;">마감 시간</div>
                            <input type="time" id="sch-close" value="22:00">
                        </div>
                        <div style="border-left: 2px solid #EFEBE9; padding-left: 20px;">
                            <div style="font-size: 0.9em; color: var(--secondary); margin-bottom: 4px;">브레이크 시작</div>
                            <input type="time" id="sch-bs" value="15:00">
                        </div>
                        <div>
                            <div style="font-size: 0.9em; color: var(--secondary); margin-bottom: 4px;">브레이크 끝</div>
                            <input type="time" id="sch-be" value="17:00">
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px dashed #EFEBE9;">
                        <label style="cursor: pointer; font-weight: bold; color: var(--danger);">
                            <input type="checkbox" id="sch-holiday"> ⛔ 오늘은 휴무 (영업 안함)
                        </label>
                        <button class="btn-action" onclick="saveSchedule()">설정 저장하기</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="section-box">
            <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleNoticeBoard()">
                <h3 class="section-title">📝 매장 공지사항 관리</h3>
                <span id="n-arrow">🔽</span>
            </div>

            <div id="notice-body" style="display:none; margin-top: 15px;">
                <input type="hidden" id="n-id" value=""> 
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="text" id="n-title" placeholder="제목 (예: 주차 안내)" style="flex: 3;">
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; font-weight: bold; font-size: 0.95em; color: var(--text-main);">
                        <input type="checkbox" id="n-pinned"> 📌 상단고정
                    </label>
                </div>
                <textarea id="n-content" placeholder="공지 내용을 입력하세요" style="width: 100%; height: 80px; box-sizing: border-box; margin-bottom: 10px; resize: vertical;"></textarea>
                
                <div style="display: flex; gap: 10px;">
                    <button id="btn-save-notice" class="btn-action" style="flex: 1;" onclick="saveNotice()">게시글 등록</button>
                    <button id="btn-cancel-edit" class="btn-action" style="background-color: #BCAAA4; display: none;" onclick="cancelEditMode()">취소</button>
                </div>
                
                <div style="margin-top: 25px;">
                    <div style="font-size: 0.95em; color: var(--secondary); margin-bottom: 8px; font-weight: bold;">📜 등록된 공지 목록</div>
                    <ul id="manager-notice-list"></ul>
                </div>
            </div>
        </div>

        <div style="margin-top: 40px;">
            <div style="margin-bottom: 20px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-size: 0.9em; font-weight: bold; color: var(--secondary); cursor: pointer;" onclick="toggleLogs()">
                        🕒 최근 활동 로그 (Click) 🔽
                    </div>
                    <a href="/waitingstore/history" style="text-decoration:none; color:white; background: var(--secondary); padding:6px 15px; border-radius:20px; font-size:0.85em; font-weight: bold;">📊 통계 보기</a>
                </div>
                
                <div id="log-container" style="display: none; padding: 15px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.85em; margin-top:10px;">
                    <ul id="log-list" style="list-style: none; padding: 0; margin: 0;"><li>로딩 중...</li></ul>
                </div>
            </div>

            <div style="overflow: hidden; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;">
                <span style="font-size: 1.4em; font-weight: bold; color: var(--primary);">현재 대기 팀</span>
                <button class="btn-refresh" onclick="loadList()">🔄 새로고침</button>
            </div>
            <table>
                <thead>
                    <tr><th width="10%">순번</th><th width="20%">회원명</th><th width="25%">전화번호</th><th width="10%">인원</th><th width="15%">상태</th><th width="20%">관리</th></tr>
                </thead>
                <tbody id="list-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const storeId = 2; 
        let loadedNotices = [];

        window.onload = function() {
            checkStatus();
            loadList();
            loadNotices();
            setInterval(loadList, 3000); 
        };

        function toggleNoticeBoard() {
            const body = document.getElementById('notice-body');
            const arrow = document.getElementById('n-arrow');
            
            if (body.style.display === 'none') {
                body.style.display = 'block';
                arrow.innerText = '🔼';
            } else {
                body.style.display = 'none';
                arrow.innerText = '🔽';
            }
        }

        function loadNotices() {
            fetch(`/waiting/notices?storeId=${storeId}`).then(res => res.json()).then(list => {
                loadedNotices = list;
                const ul = document.getElementById('manager-notice-list');
                ul.innerHTML = "";
                
                if(list.length === 0) { 
                    ul.innerHTML = "<li style='justify-content:center; color:#aaa;'>등록된 공지가 없습니다.</li>"; 
                    return; 
                }
                
                list.forEach(item => {
                    const pinIcon = item.pinned ? '<span style="color:var(--danger); font-weight:bold; margin-right:4px;">[필독]</span>' : ''; 
                    const dateStr = item.regDate ? item.regDate.replace('T', ' ').substring(0, 16) : '';
                    
                    ul.innerHTML += `
                        <li>
                            <div class="notice-content-area">
                                <div style="margin-bottom: 6px;">
                                    ${pinIcon} <span style="font-weight: bold; color: var(--text-main); font-size: 1.05em;">${item.title}</span> 
                                    <span style="font-size:0.85em; color:#aaa; margin-left:8px;">${dateStr}</span>
                                </div>
                                <div style="color:#555; white-space: pre-wrap; font-size:0.95em; line-height: 1.4;">${item.content}</div>
                            </div>
                            <div class="notice-btn-group">
                                <button class="btn-edit" onclick="editMode(${item.id})">수정</button>
                                <button class="btn-del" onclick="deleteNotice(${item.id})">삭제</button>
                            </div>
                        </li>`;
                });
            });
        }

        function saveNotice() {
            const id = document.getElementById('n-id').value;
            const title = document.getElementById('n-title').value;
            const content = document.getElementById('n-content').value;
            const isPinned = document.getElementById('n-pinned').checked;
            
            if(!title || !content) return alert("제목과 내용을 입력하세요.");
            
            const url = id ? '/waiting/notice/update' : '/waiting/notice/create';
            fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id, storeId: storeId, title: title, content: content, isPinned: isPinned }) })
            .then(res => { 
                if(res.ok) { 
                    alert(id ? "수정되었습니다." : "등록되었습니다."); 
                    cancelEditMode(); 
                    loadNotices(); 
                } else alert("처리 실패"); 
            });
        }

        function deleteNotice(id) {
            if(!confirm("정말 삭제하시겠습니까?")) return;
            fetch(`/waiting/notice/delete/${id}`, { method: 'POST' })
            .then(res => { 
                if(res.ok) { 
                    loadNotices(); 
                    cancelEditMode(); 
                } else alert("삭제 실패"); 
            });
        }

        function editMode(id) {
            const item = loadedNotices.find(n => n.id === id);
            if(!item) return;
            
            const body = document.getElementById('notice-body');
            if(body.style.display === 'none') toggleNoticeBoard();

            document.getElementById('n-id').value = item.id;
            document.getElementById('n-title').value = item.title;
            document.getElementById('n-content').value = item.content;
            document.getElementById('n-pinned').checked = item.pinned;
            document.getElementById('btn-save-notice').innerText = "수정 저장";
            document.getElementById('btn-cancel-edit').style.display = "inline-block";
            document.getElementById('n-title').focus();
            
            window.scrollTo({ top: body.offsetTop - 100, behavior: 'smooth' });
        }

        function cancelEditMode() {
            document.getElementById('n-id').value = "";
            document.getElementById('n-title').value = "";
            document.getElementById('n-content').value = "";
            document.getElementById('n-pinned').checked = false;
            document.getElementById('btn-save-notice').innerText = "게시글 등록";
            document.getElementById('btn-cancel-edit').style.display = "none";
        }

        // --- 로그 조회 ---
        function toggleLogs() {
            const container = document.getElementById('log-container');
            if (container.style.display === 'none') { container.style.display = 'block'; loadLogs(); } else container.style.display = 'none';
        }
        function loadLogs() {
            fetch(`/waiting/logs?storeId=${storeId}`).then(r => r.json()).then(list => {
                const ul = document.getElementById('log-list');
                ul.innerHTML = "";
                if(list.length === 0) { ul.innerHTML = "<li>기록된 활동이 없습니다.</li>"; return; }
                list.forEach(item => {
                    const date = item.regDate ? item.regDate.replace('T', ' ').substring(11, 19) : '-';
                    let color = '#fff';
                    if(item.actionType === 'CALL') color = '#FFB74D'; 
                    else if(item.actionType === 'ENTER') color = '#A5D6A7';
                    else if(item.actionType === 'CANCEL') color = '#EF9A9A'; 
                    else if(item.actionType === 'TOGGLE') color = '#90CAF9';
                    
                    ul.innerHTML += `<li style="margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px dashed #5D4037;"><span style="color: #BCAAA4;">[${date}]</span> <span style="font-weight: bold; color: ${color}; width: 60px; display:inline-block;">${item.actionType}</span> <span>${item.logMessage}</span></li>`;
                });
            });
        }

        // --- 기타 기능 ---
        function checkStatus() { fetch(`/waiting/store-info?storeId=${storeId}`).then(r => r.json()).then(s => updateStatusUI(s.waitingOpen)); }
        function toggleStatus() { fetch(`/waiting/toggle?storeId=${storeId}`, { method: 'POST' }).then(r => r.json()).then(o => { updateStatusUI(o); alert(o ? "접수 시작" : "접수 마감"); }); }
        function updateStatusUI(isOpen) {
            const btn = document.getElementById('btn-status');
            if (isOpen) { btn.innerText = "🟢 접수 중 (ON)"; btn.className = "btn-toggle on"; }
            else { btn.innerText = "🔴 마감됨 (OFF)"; btn.className = "btn-toggle off"; }
        }
        function sendWsNotice() {
            const content = document.getElementById('ws-content').value;
            if(!content) return alert("내용 입력");
            fetch(`/waiting/notice`, { method: 'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:`content=${content}`})
            .then(() => { alert("전송 완료"); document.getElementById('ws-content').value=''; });
        }
        function loadList() {
            fetch(`/waiting/list?storeId=${storeId}`).then(r => r.json()).then(list => {
                const tbody = document.getElementById('list-body');
                tbody.innerHTML = '';
                if(list.length===0) { tbody.innerHTML='<tr><td colspan="6" style="padding:40px; color:#aaa;">현재 대기 중인 팀이 없습니다.</td></tr>'; return;}
                list.forEach(item => {
                    let btns = '';
                    if(item.status==='WAITING') btns=`<button class="btn-call" onclick="action('call',${item.id})">🔔 호출</button> <button class="btn-reject" onclick="action('reject',${item.id})">❌ 취소</button>`;
                    else if(item.status==='CALLED') btns=`<button class="btn-enter" onclick="action('enter',${item.id})">✅ 입장</button> <button class="btn-reject" onclick="action('reject',${item.id})">❌ 취소</button>`;
                    
                    const row=`<tr><td><b>${item.waitingNumber}</b></td><td>${item.memberName||'비회원'}</td><td>${item.memberPhone||'-'}</td><td>${item.teamSize}명</td><td><span class="status-badge status-${item.status}">${item.status}</span></td><td>${btns}</td></tr>`;
                    tbody.innerHTML+=row;
                });
            });
        }
        function action(type, id) { 
            if(!confirm("처리하시겠습니까?")) return; 
            fetch(`/waiting/${type}/${id}`, {method:'POST'}).then(r=>{if(r.ok)loadList();}); 
        }
        
        function saveSchedule() {
            const checkboxes = document.querySelectorAll('input[name="days"]:checked');
            if (checkboxes.length === 0) return alert("요일을 하나 이상 선택해주세요.");
            const days = Array.from(checkboxes).map(cb => parseInt(cb.value));
            const openTime = document.getElementById('sch-open').value;
            const closeTime = document.getElementById('sch-close').value;
            const breakStart = document.getElementById('sch-bs').value;
            const breakEnd = document.getElementById('sch-be').value;
            const isHoliday = document.getElementById('sch-holiday').checked;

            if (!openTime || !closeTime) return alert("오픈/마감 시간을 입력하세요.");

            const payload = {
                storeId: storeId,
                days: days,
                openTime: openTime,
                closeTime: closeTime,
                breakStart: breakStart,
                breakEnd: breakEnd,
                isOpen: isHoliday ? "N" : "Y" 
            };

            fetch('/waiting/schedule/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (res.ok) alert("영업 시간이 저장되었습니다.");
                else alert("저장 실패");
            });
        }
        
        function toggleSchedule() {
            const body = document.getElementById('schedule-body');
            const arrow = document.getElementById('s-arrow');
            if (body.style.display === 'none') { body.style.display = 'block'; arrow.innerText = '🔼'; } 
            else { body.style.display = 'none'; arrow.innerText = '🔽'; }
        }
    </script>
</body>
</html>
