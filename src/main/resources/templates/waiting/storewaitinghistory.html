<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>매장 웨이팅 기록</title>
    <style>
        /* -------------------------------------------------------
           YamiPick Theme: Warm Choco & Cream
        ------------------------------------------------------- */
        :root {
            --primary: #6D4C41;   /* 진한 갈색 */
            --secondary: #8D6E63; /* 라떼색 */
            --bg-body: #F5F5F5;   /* 배경 */
            --text-main: #3E2723; /* 텍스트 */
            --border: #D7CCC8;
            --card-shadow: 0 4px 15px rgba(109, 76, 65, 0.08);
            
            /* 통계 박스 색상 */
            --stat-enter: #6D4C41;  /* 입장 (메인) */
            --stat-call: #8D6E63;   /* 호출 (보조) */
            --stat-cancel: #E57373; /* 취소 (소프트 레드) */
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            padding: 20px; 
            background-color: var(--bg-body); 
            max-width: 800px; 
            margin: 0 auto; 
            
            /* ★ 핵심: 헤더 간격 확보 */
            padding-top: 60px; 
        }

        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: var(--card-shadow); 
            margin-bottom: 25px; 
            margin-top: 20px;
        }
        
        h2 { margin-top: 0; color: var(--primary); font-weight: 800; letter-spacing: -0.5px; } 
        h3 { color: var(--secondary); margin-bottom: 15px; }

        /* 날짜 조회 영역 */
        .date-control { margin: 25px 0; display: flex; align-items: center; gap: 10px; }
        input[type="date"] {
            padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; color: var(--text-main);
        }
        .btn-search {
            background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-search:hover { background-color: #5D4037; transform: translateY(-1px); }
        .btn-home {
             background: var(--secondary); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; cursor: pointer; text-decoration: none; font-weight: bold;
        }

        /* 통계 박스 스타일 */
        .stat-box { display: flex; gap: 15px; margin-bottom: 10px; }
        .stat-item { 
            flex: 1; 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            color: white; 
            font-weight: bold; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        .bg-enter { background-color: var(--stat-enter); } 
        .bg-call { background-color: var(--stat-call); } 
        .bg-cancel { background-color: var(--stat-cancel); } 
        
        .stat-title { display: block; font-size: 0.9em; opacity: 0.9; margin-bottom: 5px; }
        .stat-num { font-size: 2em; display: block; }

        /* 테이블 스타일 */
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 10px; border: 1px solid #EFEBE9; border-radius: 10px; overflow: hidden; }
        th { 
            background: var(--primary); 
            color: white; 
            padding: 15px; 
            text-align: left; 
            font-weight: 600; 
        }
        td { 
            padding: 15px; 
            border-bottom: 1px solid #EFEBE9; 
            color: #4E342E; 
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #FFF8E1; /* 호버시 연한 크림색 */ }
        
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.85em; color: white; display: inline-block; min-width: 60px; text-align: center; }
    </style>
</head>
<body>
<div th:replace="~{common/header :: headerFragment}"></div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>📅 일별 운영 기록</h2>
            <button class="btn-home" onclick="location.href='/waitingstore'">🍴 매장 관리로</button>
        </div>
        
        <div class="date-control">
            <label style="font-weight: bold; color: #5D4037;">날짜 선택</label>
            <input type="date" id="date-picker">
            <button class="btn-search" onclick="loadDailyLog()">조회</button>
        </div>

        <div class="stat-box">
            <div class="stat-item bg-enter">
                <span class="stat-title">입장 완료</span>
                <span id="s-enter" class="stat-num">0</span>
            </div>
            <div class="stat-item bg-call">
                <span class="stat-title">호출 횟수</span>
                <span id="s-call" class="stat-num">0</span>
            </div>
            <div class="stat-item bg-cancel">
                <span class="stat-title">취소/거절</span>
                <span id="s-cancel" class="stat-num">0</span>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>📜 상세 활동 로그</h3>
        <table>
            <thead>
                <tr>
                    <th width="20%">시간</th>
                    <th width="15%">인원</th> 
                    <th width="15%">구분</th>
                    <th>내용</th>
                </tr>
            </thead>
            <tbody id="log-body">
                <tr><td colspan="4" style="text-align:center; padding: 30px; color: #aaa;">날짜를 선택하고 조회하세요.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // 오늘 날짜로 기본 설정
        document.getElementById('date-picker').valueAsDate = new Date();

        function loadDailyLog() {
            const date = document.getElementById('date-picker').value;
            const storeId = 2; 

            fetch(`/waiting/logs/daily?storeId=${storeId}&date=${date}`)
                .then(res => res.json())
                .then(data => {
                    // 1. 통계 업데이트
                    document.getElementById('s-enter').innerText = data.stats.enters;
                    document.getElementById('s-call').innerText = data.stats.calls;
                    document.getElementById('s-cancel').innerText = data.stats.cancels;

                    // 2. 테이블 업데이트
                    const tbody = document.getElementById('log-body');
                    tbody.innerHTML = "";
                    
                    if (data.logs.length === 0) {
                        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; padding: 40px; color:#aaa;'>기록이 없습니다.</td></tr>";
                        return;
                    }

                    data.logs.forEach(log => {
                        let badgeColor = '#BCAAA4'; // 기본 회색
                        let badgeText = log.actionType;

                        // 색상 매핑 (YamiPick 테마)
                        if(log.actionType === 'ENTER') { badgeColor = '#6D4C41'; badgeText = '입장'; }
                        else if(log.actionType === 'CALL') { badgeColor = '#8D6E63'; badgeText = '호출'; }
                        else if(log.actionType === 'CANCEL') { badgeColor = '#E57373'; badgeText = '취소'; }
                        else if(log.actionType === 'TOGGLE') { badgeColor = '#FFB74D'; badgeText = '설정'; }
                        
                        // 날짜 포맷팅
                        const timeStr = log.regDate ? log.regDate.replace('T', ' ').substring(11, 19) : '-';
                        
                        const sizeStr = log.teamSize > 0 ? `<b style="color:#3E2723">${log.teamSize}</b>명` : '<span style="color:#ccc">-</span>';

                        const row = `
                            <tr>
                                <td>${timeStr}</td>
                                <td>${sizeStr}</td>
                                <td><span class="badge" style="background-color: ${badgeColor}">${badgeText}</span></td>
                                <td style="color:#5D4037;">${log.logMessage}</td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                })
                .catch(err => {
                    console.error("로그 로딩 실패:", err);
                    alert("로그를 불러오는데 실패했습니다.");
                });
        }
        
        window.onload = loadDailyLog;
    </script>
</body>
</html>
