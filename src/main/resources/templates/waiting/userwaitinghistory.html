<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 웨이팅 기록</title>
    <style>
        /* -------------------------------------------------------
           YamiPick Theme: Warm Choco & Cream
        ------------------------------------------------------- */
        :root {
            --primary: #6D4C41;   /* 진한 갈색 */
            --primary-hover: #5D4037;
            --secondary: #8D6E63; /* 라떼색 */
            --bg-body: #F5F5F5;   /* 배경 */
            --text-main: #3E2723; /* 텍스트 */
            --border: #D7CCC8;
            --card-shadow: 0 4px 15px rgba(109, 76, 65, 0.08);
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            padding: 20px; 
            text-align: center; 
            max-width: 420px; 
            margin: 0 auto; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            
            padding-top: 60px; 
        }

        .container { 
            background: white; 
            padding: 30px 20px; 
            border-radius: 20px; 
            box-shadow: var(--card-shadow); 
            min-height: 500px; 
            margin-top: 20px;
            position: relative; 
        }
        
        h2 { margin-top: 10px; color: var(--primary); font-weight: 800; } 
        
        /* 리스트 스타일 */
        .history-list { list-style: none; padding: 0; margin-top: 30px; text-align: left; }
        
        /* 카드 아이템 스타일 */
        .h-item { 
            background: #fff; 
            border: 1px solid #EFEBE9; 
            padding: 20px; 
            margin-bottom: 15px; 
            border-radius: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: 0.2s;
        }
        .h-item:hover { transform: translateY(-2px); box-shadow: 0 5px 12px rgba(109, 76, 65, 0.1); border-color: var(--border); }
        
        .h-info { display: flex; flex-direction: column; gap: 6px; }
        .h-store { font-weight: bold; font-size: 1.1em; color: var(--text-main); }
        .h-date { font-size: 0.85em; color: #A1887F; }
        .h-meta { font-size: 0.9em; color: var(--secondary); font-weight: 500; }

        /* 상태 뱃지 */
        .h-status { font-weight: bold; padding: 6px 12px; border-radius: 8px; font-size: 0.85em; }
        
        /* 입장 완료 (갈색 테마) */
        .st-ENTERED { background: #EFEBE9; color: var(--primary); border: 1px solid #D7CCC8; } 
        /* 취소 (연한 붉은색) */
        .st-CANCELED { background: #FFEBEE; color: #E57373; border: 1px solid #FFCDD2; } 
        /* 대기중 (라떼색) */
        .st-WAITING { background: var(--secondary); color: white; } 

        /* 뒤로가기 버튼 */
        .btn-back { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 1.1em; 
            cursor: pointer; 
            margin-top: 30px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .btn-back:hover { background: var(--primary-hover); transform: translateY(-2px); }
    </style>
</head>
<body>
<div th:replace="~{common/header :: headerFragment}"></div>

    <div class="container">
        <h2>🧾 내 웨이팅 기록</h2>
        <p style="color:#8D6E63; font-size:0.95em;">최근 방문 기록을 확인하세요.</p>
        
        <ul id="list-area" class="history-list">
            <li style="text-align:center; margin-top:50px; color:#BCAAA4;">
                <span style="font-size:2em; display:block; margin-bottom:10px;">⏳</span>
                로딩 중...
            </li>
        </ul>

        <button class="btn-back" onclick="location.href='/waitinguser'">⬅️ 메인으로 돌아가기</button>
    </div>

    <script>
        const userId = 1; // 테스트용 ID

        window.onload = function() {
            fetch(`/waiting/history?userId=${userId}`)
                .then(res => res.json())
                .then(list => {
                    const ul = document.getElementById('list-area');
                    ul.innerHTML = "";

                    if (list.length === 0) {
                        ul.innerHTML = "<li style='text-align:center; margin-top:50px; color:#BCAAA4;'>방문 기록이 없습니다.</li>";
                        return;
                    }

                    list.forEach(item => {
                        let statusText = item.status;
                        let statusClass = item.status; // ENTERED, CANCELED, WAITING

                        if(item.status === 'ENTERED') statusText = '입장완료';
                        else if(item.status === 'CANCELED') statusText = '취소됨';
                        else if(item.status === 'WAITING') statusText = '대기중';

                        // 날짜 포맷팅 (T 제거 및 초 단위 제거)
                        const dateStr = item.regDate ? item.regDate.replace('T', ' ').substring(0, 16) : '-';

                        ul.innerHTML += `
                            <li class="h-item">
                                <div class="h-info">
                                    <span class="h-store">🍽️ ${item.storeName || '알 수 없는 매장'}</span>
                                    <span class="h-meta">${item.teamSize}명 • 대기번호 ${item.waitingNumber}번</span>
                                    <span class="h-date">${dateStr}</span>
                                </div>
                                <div class="h-status st-${statusClass}">
                                    ${statusText}
                                </div>
                            </li>
                        `;
                    });
                })
                .catch(err => {
                    document.getElementById('list-area').innerHTML = "<li style='text-align:center; color:#E57373;'>기록을 불러오는데 실패했습니다.</li>";
                });
        };
    </script>
</body>
</html>
