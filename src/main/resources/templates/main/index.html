<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yamipick - 맛집 예약의 모든 것</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="/css/common.css" rel="stylesheet">
    
    <style>
        /* [1] 섹션 여백 */
        .banner-section {
            padding-top: 120px; /* 헤더 높이만큼 띄움 */
            padding-bottom: 50px;
        }

        /* [2] 배너 박스 스타일 */
        .banner-box {
            border-radius: 20px;
            overflow: hidden;
            /* 그림자는 제거하고 테두리만 강조 (요청사항 반영) */
        }

        /* [3] 반응형 높이 제어 (핵심!) */
        
        /* PC 화면 (992px 이상): 배너와 검색어 창 높이를 400px로 똑같이 맞춤 */
        @media (min-width: 992px) {
            .banner-row {
                height: 400px;
            }
        }

        /* 모바일 화면 (991px 이하): 높이 제한 해제 & 위아래 배치 */
        @media (max-width: 991px) {
            .banner-row {
                height: auto !important;
            }
            .banner-img-item {
                height: 250px !important; /* 모바일 배너 높이 */
            }
            .keyword-col {
                margin-top: 20px; /* 배너와 검색어 사이 간격 */
                height: 350px;    /* 모바일 검색어 창 높이 */
            }
        }
        /* 카테고리 아이콘 스타일 (영역 강조 버전) */
		.category-icon {
		    width: 65px;
		    height: 65px;
		    
		    /* [1] 배경색: 연한 회색으로 변경 (흰색 배경과 구분됨) */
		    background-color: #f8f9fa;   
		    
		    /* [2] 테두리 추가: 영역 확실하게 표시 */
		    border: 1px solid #dee2e6;
		    
		    /* [3] 그림자 추가: 버튼 같은 입체감 */
		    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
		
		    border-radius: 50%;          /* 원형 */
		    display: flex;
		    align-items: center;
		    justify-content: center;
		    font-size: 2rem;             /* 이모지 크기 */
		    margin: 0 auto 10px auto;    /* 아래쪽 간격 */
		    transition: all 0.2s ease;
		}
		
		/* 마우스 올렸을 때 효과 */
		.category-item:hover .category-icon {
		    transform: translateY(-5px);
		    background-color: #fff3e0;   /* 호버 시 연한 주황색 */
		    border-color: #ffcc80;       /* 테두리도 주황색 */
		    box-shadow: 0 5px 15px rgba(255, 111, 0, 0.15); /* 그림자 진하게 */
		}
		
		/* 텍스트 색상 변화 */
		.category-item:hover span {
		    color: #ff6f00;
		    font-weight: 800;
		}
    </style>
</head>
<body>

<div th:replace="~{common/header :: headerFragment}"></div>


<section class="container text-center mb-3" style="padding-top: 100px;">
    <h2 class="fw-bold text-dark mb-1" style="font-family: 'Noto Sans KR', sans-serif; letter-spacing: -1px;">
        오늘, 어디서 <span style="color: #6D4C41;">맛있는 한 끼</span> 하실래요?
    </h2>
    <p class="text-muted m-0" style="font-size: 1rem;">
        Yamipick이 엄선한 최고의 맛집을 만나보세요 🍽️
    </p>
</section>

<section class="banner-section" style="padding-top: 10px;"> <div class="container">

<section class="banner-section">
    <div class="container">
        <div class="row g-4 banner-row">
            
            <div class="col-lg-8 h-100">
                <div id="mainCarousel" class="carousel slide banner-box border border-3 h-100" 
                     data-bs-ride="carousel" 
                     style="border-color: #6D4C41 !important;">
                    
                    <th:block th:if="${bannerList != null and !bannerList.isEmpty()}">
                        <div class="carousel-indicators">
                            <button th:each="banner, stat : ${bannerList}" 
                                    type="button" data-bs-target="#mainCarousel" 
                                    th:data-bs-slide-to="${stat.index}" 
                                    th:classappend="${stat.index == 0} ? 'active'"></button>
                        </div>

                        <div class="carousel-inner h-100">
                            <div th:each="banner, stat : ${bannerList}" 
                                 class="carousel-item h-100" 
                                 th:classappend="${stat.index == 0} ? 'active'">
                                <img th:src="${banner.imgPath}" class="d-block w-100 h-100 banner-img-item" 
                                     style="object-fit: cover;" th:alt="${banner.title}">
                            </div>
                        </div>

                        <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon"></span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
                            <span class="carousel-control-next-icon"></span>
                        </button>
                    </th:block>

                    <div th:if="${bannerList == null or bannerList.isEmpty()}" class="bg-white text-center d-flex align-items-center justify-content-center h-100">
                        <div class="text-muted">
                            <i class="fas fa-images fa-3x mb-3"></i>
                            <h4>등록된 배너가 없습니다.</h4>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 h-100 keyword-col">
                <div class="card border-0 shadow-sm h-100 bg-white" style="border-radius: 20px;">
                    <div class="card-header bg-white border-0 pt-4 pb-2 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold m-0 text-dark">
                            <i class="fas fa-fire me-2 text-danger"></i>인기 검색어
                        </h5>
                        <span class="badge bg-light text-secondary fw-normal border">Real-time</span>
                    </div>
                    
                    <div class="card-body overflow-auto">
                        <div th:if="${topKeywords == null or topKeywords.isEmpty()}" class="text-center py-5 text-muted small">
                            <i class="fas fa-search mb-2 opacity-50 fa-2x"></i><br>
                            집계 중...
                        </div>

                        <div class="list-group list-group-flush">
                            <div th:each="word, stat : ${topKeywords}" class="list-group-item border-0 px-0 py-2 d-flex align-items-center">
                                <div class="me-3 fw-bold fs-5 text-center" style="width: 24px;"
                                     th:classappend="${stat.index == 0} ? 'text-danger' : (${stat.index == 1} ? 'text-warning' : (${stat.index == 2} ? 'text-success' : 'text-muted'))"
                                     th:text="${stat.count}">1</div>
                                
                                <a th:href="@{/map(q=${word})}" class="flex-grow-1 fw-bold text-dark text-decoration-none text-truncate">
                                    [[${word}]]
                                </a>
                                
                                <div class="text-danger small"><i class="fas fa-caret-up"></i></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div> </div>
</section>

<section class="container mt-5 mb-5">
    <h5 class="fw-bold mb-3 ms-1 text-dark">
        <i class="fas fa-utensils me-2 text-warning"></i>오늘은 뭐 먹을까요?
    </h5>
    
    <div class="row g-3 justify-content-center text-center">
        
        <div class="col-4 col-md-2">
            <a href="/map?q=한식" class="text-decoration-none text-dark d-block category-item">
                <div class="category-icon shadow-sm mb-2">🍚</div>
                <span class="fw-bold small">한식</span>
            </a>
        </div>

        <div class="col-4 col-md-2">
            <a href="/map?q=파스타" class="text-decoration-none text-dark d-block category-item">
                <div class="category-icon shadow-sm mb-2">🍝</div>
                <span class="fw-bold small">양식/파스타</span>
            </a>
        </div>

        <div class="col-4 col-md-2">
            <a href="/map?q=중식" class="text-decoration-none text-dark d-block category-item">
                <div class="category-icon shadow-sm mb-2">🥟</div>
                <span class="fw-bold small">중식</span>
            </a>
        </div>

        <div class="col-4 col-md-2">
            <a href="/map?q=초밥" class="text-decoration-none text-dark d-block category-item">
                <div class="category-icon shadow-sm mb-2">🍣</div>
                <span class="fw-bold small">일식/회</span>
            </a>
        </div>

        <div class="col-4 col-md-2">
            <a href="/map?q=떡볶이" class="text-decoration-none text-dark d-block category-item">
                <div class="category-icon shadow-sm mb-2">🍢</div>
                <span class="fw-bold small">분식</span>
            </a>
        </div>

        <div class="col-4 col-md-2">
            <a href="/map?q=카페" class="text-decoration-none text-dark d-block category-item">
                <div class="category-icon shadow-sm mb-2">☕</div>
                <span class="fw-bold small">카페/디저트</span>
            </a>
        </div>

    </div>
</section>

<section class="container mb-5">
    <div class="p-4 bg-white rounded-4 shadow-sm h-100 border">
        <h5 class="fw-bold mb-3">
            <i class="fas fa-crown text-warning me-2"></i>실시간 핫플레이스 TOP 5
        </h5>
        
        <div class="list-group list-group-flush">
            <div th:if="${hotPlaces.isEmpty()}" class="text-center py-3 text-muted">
                아직 랭킹 데이터가 없습니다.
            </div>

            <a th:each="place : ${hotPlaces}" 
               th:href="@{/map(q=${place.name})}"
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center border-0 px-2 py-3 hover-bg">
                
                <div class="d-flex align-items-center">
                    <span class="badge rounded-pill me-3" 
                          style="width: 25px; height: 25px; display:flex; align-items:center; justify-content:center;"
                          th:classappend="${place.rank == 1} ? 'bg-danger' : (${place.rank == 2} ? 'bg-warning text-dark' : (${place.rank == 3} ? 'bg-success' : 'bg-secondary'))"
                          th:text="${place.rank}">1</span>
                    
                    <span class="fw-bold text-dark fs-5">[[${place.name}]]</span>
                </div>
                
                <div class="text-end">
                    <span class="badge bg-light text-secondary border">
                        <i class="fas fa-eye me-1"></i>[[${place.count}]]
                    </span>
                    <i class="fas fa-chevron-right text-muted ms-2 small"></i>
                </div>
            </a>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
