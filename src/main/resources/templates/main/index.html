<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yamipick - 맛집 예약의 모든 것</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="/css/common.css" rel="stylesheet">
    
    <style>
        /* [1] 배너가 들어갈 전체 영역 (헤더 침범 방지용 여백) */
        .banner-section {
            padding-top: 120px; /* 헤더 높이만큼 넉넉하게 띄움 */
            padding-bottom: 50px;
        }

        /* [2] 배너 박스 디자인 (둥근 모서리 + 그림자) */
        .banner-box {
            border-radius: 20px;         /* 둥근 모서리 */
            overflow: hidden;            /* 이미지가 둥근 모서리를 튀어나가지 않게 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); /* 부드러운 그림자 */
        }

        /* [3] 이미지 크기 조절 */
        .carousel-item img {
            height: 450px;       
            object-fit: cover;   
            width: 100%;
        }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .banner-section { padding-top: 80px; } /* 모바일은 헤더가 작으므로 간격 줄임 */
            .carousel-item img { height: 250px; }  /* 모바일 배너 높이 */
        }
    </style>
</head>
<body>

<div th:replace="~{common/header :: headerFragment}"></div>


<section class="banner-section">
    <div class="container"> <div id="mainCarousel" class="carousel slide banner-box" data-bs-ride="carousel">
            
            <th:block th:if="${bannerList != null and !bannerList.isEmpty()}">
                
                <div class="carousel-indicators">
                    <button th:each="banner, stat : ${bannerList}" 
                            type="button" data-bs-target="#mainCarousel" 
                            th:data-bs-slide-to="${stat.index}" 
                            th:classappend="${stat.index == 0} ? 'active'"></button>
                </div>

                <div class="carousel-inner">
                    <div th:each="banner, stat : ${bannerList}" 
                         class="carousel-item" 
                         th:classappend="${stat.index == 0} ? 'active'">
                        <img th:src="${banner.imgPath}" class="d-block w-100" th:alt="${banner.title}">
                    </div>
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </th:block>

            <div th:if="${bannerList == null or bannerList.isEmpty()}" class="bg-white text-center d-flex align-items-center justify-content-center" style="height: 300px;">
                <div class="text-muted">
                    <i class="fas fa-images fa-3x mb-3"></i>
                    <h4>등록된 배너가 없습니다.</h4>
                </div>
            </div>

        </div>
    </div>
</section>


<div class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-center m-0">🔥 실시간 핫플레이스 TOP 5</h3>
        <span class="text-muted small">최근 7일 조회수 기준</span>
    </div>

    <div class="row g-4 justify-content-center">
        
        <div th:if="${hotPlaces == null or hotPlaces.isEmpty()}" class="col-12 text-center py-5">
            <p class="text-muted">아직 집계된 데이터가 없습니다.</p>
        </div>

        <div class="col-md-4 col-lg-2" th:each="place, stat : ${hotPlaces}">
            <div class="card h-100 border-0 shadow-sm text-center position-relative overflow-hidden">
                
                <div th:if="${stat.count <= 3}" 
                     class="position-absolute top-0 start-0 bg-danger text-white fw-bold px-3 py-1"
                     style="border-bottom-right-radius: 10px; font-size: 0.9rem; z-index: 10;">
                    <span th:text="${stat.count}">1</span>위
                </div>
                
                <div class="bg-light d-flex align-items-center justify-content-center" style="height: 120px;">
                    <i class="fas fa-utensils fa-3x text-secondary opacity-25"></i>
                </div>
                
                <div class="card-body p-3">
                    <h6 class="card-title fw-bold text-truncate mb-2" th:text="${place.name}">식당이름</h6>
                    
                    <p class="card-text small text-danger fw-bold mb-2">
                        <i class="fas fa-fire me-1"></i> <span th:text="${place.count}">0</span>회 클릭
                    </p>
                    
                    <a th:href="@{/map(keyword=${place.name})}" class="btn btn-sm btn-outline-dark w-100 rounded-pill">
                        위치 보기
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
