<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yamipick - 맛집 예약의 모든 것</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 배너 이미지 크기 고정 (반응형) */
        .carousel-item img {
            height: 400px; /* 높이 조절 */
            object-fit: cover; /* 비율 유지하며 꽉 채우기 */
        }
    </style>
</head>
<body>

<!-- 네비게이션 바 (헤더) -->
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-danger" href="/">Yamipick</a>
        <!-- ... 메뉴들 ... -->
    </div>
</nav>

<!-- ★ 메인 배너 슬라이더 -->
<div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
    
    <!-- 인디케이터 (하단 점) -->
    <div class="carousel-indicators">
        <button th:each="banner, iter : ${banners}" 
                type="button" 
                data-bs-target="#mainCarousel" 
                th:data-bs-slide-to="${iter.index}" 
                th:classappend="${iter.index == 0} ? 'active'"></button>
    </div>

    <!-- 슬라이드 이미지 영역 -->
    <div class="carousel-inner">
        <div th:each="banner, iter : ${banners}" 
             class="carousel-item" 
             th:classappend="${iter.index == 0} ? 'active'">
            
            <!-- 클릭 시 링크 이동 -->
            <a th:href="${banner.linkUrl != null ? banner.linkUrl : '#'}">
                <img th:src="${banner.imgPath}" class="d-block w-100" alt="Banner Image">
            </a>
            
            <div class="carousel-caption d-none d-md-block">
                <h5 th:text="${banner.title}">배너 제목</h5>
            </div>
        </div>
    </div>

    <!-- 이전/다음 버튼 -->
    <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>

<!-- 나머지 메인 컨텐츠 (맛집 리스트 등) -->
<div class="container mt-5">
    <h3 class="fw-bold mb-4">🔥 지금 뜨는 맛집</h3>
    <!-- ... -->
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
