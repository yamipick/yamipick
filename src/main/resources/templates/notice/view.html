<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="/css/common.css" rel="stylesheet">
    
</head>
<body>

<div th:replace="~{common/header :: headerFragment}"></div>

<div class="container py-5" style="max-width: 800px;">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold m-0">공지사항</h4>
        <a href="/notice/list" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-list me-1"></i> 목록으로
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white p-4 border-bottom">
            <h3 class="fw-bold mb-3" th:text="${notice.title}">제목</h3>
            <div class="d-flex justify-content-between text-muted small">
                <span>
                    <i class="far fa-calendar-alt me-1"></i> 
                    [[${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')}]]
                </span>
                <span>
                    <i class="far fa-eye me-1"></i> 조회수 [[${notice.viewCount}]]
                </span>
            </div>
        </div>
        
        <div class="card-body p-4" style="min-height: 300px;">
            <div class="mb-5" style="white-space: pre-wrap; line-height: 1.7; color: #333;">[[${notice.content}]]</div>
            
            <div th:if="${notice.filePath != null}" class="p-3 bg-light rounded border d-flex align-items-center">
                <i class="fas fa-download text-primary me-3 fs-4"></i>
                <div>
                    <div class="fw-bold small text-muted">첨부파일</div>
                    <span class="text-dark fw-bold">[[${notice.filePath}]]</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="text-center mt-4">
        <a href="/notice/list" class="btn btn-dark px-4">목록보기</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
