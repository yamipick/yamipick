<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 - Yamipick</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="/css/common.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{common/header :: headerFragment}"></div> 

<div class="container py-5">
    <div class="text-center mb-5">
        <h2 class="fw-bold">📢 공지사항</h2>
        <p class="text-muted">야미픽의 새로운 소식을 알려드립니다.</p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover m-0 align-middle">
                <thead class="table-light">
                    <tr class="text-center">
                        <th width="10%">No</th>
                        <th width="60%">제목</th>
                        <th width="15%">작성일</th>
                        <th width="15%">조회수</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${list.isEmpty()}">
                        <td colspan="4" class="text-center py-5 text-muted">등록된 공지사항이 없습니다.</td>
                    </tr>
                    
                    <tr th:each="notice : ${list}">
                        <td class="text-center text-muted" th:text="${notice.seqNotice}">1</td>
                        <td class="ps-4">
                            <a th:href="@{/notice/view(seq=${notice.seqNotice})}" 
                               class="text-decoration-none text-dark fw-bold link-primary">
                                [[${notice.title}]]
                            </a>
                            <i th:if="${notice.filePath != null}" class="fas fa-paperclip text-muted ms-1 small"></i>
                        </td>
                        <td class="text-center text-muted" th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd')}">2024.01.01</td>
                        <td class="text-center text-muted" th:text="${notice.viewCount}">0</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
