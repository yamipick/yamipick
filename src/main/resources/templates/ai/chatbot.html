<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>AI 챗봇 | YamiPick</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/chatbot.css}">
</head>
<body>
<div th:replace="common/header :: headerFragment"></div>

<div class="chat-wrapper">

    <div class="chat-header">
        <span class="bear-icon">🐻</span>
        <span>YamiPick Menu Chatbot</span>
    </div>

    <div id="chat-box" class="chat-box">
        <!-- 대화 로그 여기에 append -->
    </div>

    <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="메뉴 추천 요청을 입력해보세요…" />
        <button id="send-btn">보내기</button>
    </div>

</div>

<script src="/js/chatbot.js"></script>

</body>
</html>
