<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>웨이팅 관리</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; padding: 20px; background-color: #f1f2f6; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #f1f2f6; }
        h1 { margin: 0; color: #2d3436; font-size: 1.8em; }

        .btn-toggle { padding: 10px 20px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .on { background-color: #00b894; color: white; }
        .off { background-color: #636e72; color: white; }

        .section-box { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e9ecef; }
        .section-title { margin: 0; font-size: 1.1em; color: #2d3436; font-weight: bold; }

        input[type="text"], textarea { padding: 10px; border: 1px solid #dfe6e9; border-radius: 4px; font-family: inherit; }
        .btn-action { background-color: #2d3436; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        /* 리스트 스타일 */
        #manager-notice-list { list-style: none; padding: 0; margin: 0; background: white; border: 1px solid #eee; border-radius: 4px; max-height: 300px; overflow-y: auto; }
        #manager-notice-list li { padding: 15px; border-bottom: 1px solid #f1f2f6; font-size: 0.9em; display: flex; justify-content: space-between; align-items: flex-start; }
        
        .notice-btn-group button { font-size: 0.8em; padding: 4px 8px; margin-left: 5px; border-radius: 3px; cursor: pointer; border: none; }
        .btn-edit { background: #74b9ff; color: white; }
        .btn-del { background: #ff7675; color: white; }

        /* 대기 목록 테이블 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th { background-color: #636e72; color: white; padding: 12px; }
        td { border-bottom: 1px solid #eee; padding: 12px; text-align: center; color: #2d3436; }
        tr:hover { background-color: #f1f2f6; }

        .btn-refresh { background-color: #0984e3; color: white; float: right; margin-bottom: 10px; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-call { background-color: #fdcb6e; color: #2d3436; padding: 6px 12px; border-radius: 4px; border:none; cursor:pointer;} 
        .btn-enter { background-color: #00b894; color: white; padding: 6px 12px; border-radius: 4px; border:none; cursor:pointer;}   
        .btn-reject { background-color: #ff7675; color: white; padding: 6px 12px; border-radius: 4px; border:none; cursor:pointer;}
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 0.8em; }
        .status-WAITING { background-color: #81ecec; color: #006266; }
        .status-CALLED { background-color: #fab1a0; color: #d63031; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>웨이팅 관리</h1>
            <button id="btn-status" class="btn-toggle on" onclick="toggleStatus()">접수 중</button>
        </div>
        
        <div class="section-box" style="background: #ffeaa750; border-color: #ffeaa7;">
            <h3 class="section-title" style="margin-bottom: 15px;">🔔 알림</h3>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="ws-content" placeholder="예: 재료 소진으로 마감합니다." style="flex: 1;">
                <button class="btn-action" onclick="sendWsNotice()">전송</button>
            </div>
        </div>
        
        <div class="section-box">
            <h3 class="section-title">⏰ 영업 시간 설정</h3>
            <div style="background: #fff; padding: 15px; border: 1px solid #eee; border-radius: 5px;">
                
                <div style="margin-bottom: 15px;">
                    <span style="font-weight:bold; margin-right: 10px;">요일 선택:</span>
                    <label><input type="checkbox" name="days" value="1" checked> 월</label>
                    <label><input type="checkbox" name="days" value="2" checked> 화</label>
                    <label><input type="checkbox" name="days" value="3" checked> 수</label>
                    <label><input type="checkbox" name="days" value="4" checked> 목</label>
                    <label><input type="checkbox" name="days" value="5" checked> 금</label>
                    <label><input type="checkbox" name="days" value="6"> 토</label>
                    <label><input type="checkbox" name="days" value="0"> 일</label>
                </div>

                <div style="display: flex; gap: 20px; flex-wrap: wrap; align-items: center;">
                    <div>
                        <div style="font-size: 0.9em; color: #666;">오픈 시간</div>
                        <input type="time" id="sch-open" value="10:00">
                    </div>
                    <div>
                        <div style="font-size: 0.9em; color: #666;">마감 시간</div>
                        <input type="time" id="sch-close" value="22:00">
                    </div>
                    <div style="border-left: 1px solid #ddd; padding-left: 20px;">
                        <div style="font-size: 0.9em; color: #666;">브레이크 타임 시작</div>
                        <input type="time" id="sch-bs" value="15:00">
                    </div>
                    <div>
                        <div style="font-size: 0.9em; color: #666;">브레이크 타임 끝</div>
                        <input type="time" id="sch-be" value="17:00">
                    </div>
                </div>

                <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
                    <label style="cursor: pointer;">
                        <input type="checkbox" id="sch-holiday"> ⛔ 해당일은 휴무(영업 안함)
                    </label>
                    <button class="btn-action" style="background-color: #0984e3;" onclick="saveSchedule()">설정 적용하기</button>
                </div>
                
                <p style="font-size: 0.8em; color: #888; margin-top: 10px; margin-bottom: 0;">
                    ※ 선택한 요일에 일괄 적용됩니다. 브레이크 타임이 없으면 비워두세요.
                </p>
            </div>
        </div>

        <div class="section-box">
            <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleNoticeBoard()">
                <h3 class="section-title">📝 매장 공지사항 게시판</h3>
                <span id="n-arrow">🔽</span>
            </div>

            <div id="notice-body" style="display:none; margin-top: 15px;">
                <input type="hidden" id="n-id" value=""> 
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="text" id="n-title" placeholder="제목 (예: 주차 안내)" style="flex: 3;">
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; font-weight: bold; font-size: 0.9em;">
                        <input type="checkbox" id="n-pinned"> 📌상단고정
                    </label>
                </div>
                <textarea id="n-content" placeholder="공지 내용을 입력하세요" style="width: 100%; height: 80px; box-sizing: border-box; margin-bottom: 10px; resize: vertical;"></textarea>
                
                <div style="display: flex; gap: 5px;">
                    <button id="btn-save-notice" class="btn-action" style="flex: 1; background-color: #636e72;" onclick="saveNotice()">게시글 등록</button>
                    <button id="btn-cancel-edit" class="btn-action" style="background-color: #b2bec3; display: none;" onclick="cancelEditMode()">취소</button>
                </div>
                
                <div style="margin-top: 20px;">
                    <div style="font-size: 0.9em; color: #666; margin-bottom: 5px;">📜 등록된 공지 목록</div>
                    <ul id="manager-notice-list"></ul>
                </div>
            </div>
        </div>

        <div style="margin-top: 40px;">
            <div style="margin-bottom: 20px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-size: 0.9em; font-weight: bold; color: #666; cursor: pointer;" onclick="toggleLogs()">
                        🕒 최근 활동 로그 (Click to View) 🔽
                    </div>
                    <a href="/waitingstore/history" style="text-decoration:none; color:white; background:#636e72; padding:5px 10px; border-radius:4px; font-size:0.8em;">📊 상세 기록 보기</a>
                </div>
                
                <div id="log-container" style="display: none; background: #2d3436; color: #dfe6e9; padding: 10px; border-radius: 5px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.85em; margin-top:5px;">
                    <ul id="log-list" style="list-style: none; padding: 0; margin: 0;"><li>로딩 중...</li></ul>
                </div>
            </div>

            <div style="overflow: hidden; margin-bottom: 10px;">
                <span style="float: left; font-size: 1.4em; font-weight: bold; color: #2d3436;">대기 목록</span>
                <button class="btn-refresh" onclick="loadList()">🔄 새로고침</button>
            </div>
            <table>
                <thead>
                    <tr><th width="10%">순번</th><th width="20%">회원명</th><th width="25%">전화번호</th><th width="10%">인원</th><th width="15%">상태</th><th width="20%">관리</th></tr>
                </thead>
                <tbody id="list-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const storeId = 2; 
        let loadedNotices = [];

        window.onload = function() {
            checkStatus();
            loadList();
            loadNotices();
            setInterval(loadList, 3000); // 3초마다 대기 목록 갱신
        };

        // --- ★ [추가] 게시판 토글 함수 ---
        function toggleNoticeBoard() {
            const body = document.getElementById('notice-body');
            const arrow = document.getElementById('n-arrow');
            
            if (body.style.display === 'none') {
                body.style.display = 'block';
                arrow.innerText = '🔼';
            } else {
                body.style.display = 'none';
                arrow.innerText = '🔽';
            }
        }

        // --- 공지사항 관리 ---
        function loadNotices() {
            fetch(`/waiting/notices?storeId=${storeId}`).then(res => res.json()).then(list => {
                loadedNotices = list;
                const ul = document.getElementById('manager-notice-list');
                ul.innerHTML = "";
                if(list.length === 0) { ul.innerHTML = "<li style='color:#aaa; justify-content:center;'>등록된 공지가 없습니다.</li>"; return; }
                list.forEach(item => {
                    const pinIcon = item.pinned ? '<span style="color:red; font-weight:bold;">[필독]</span> ' : '';
                    // 날짜 표시 (T 제거)
                    const dateStr = item.regDate ? item.regDate.replace('T', ' ') : '';
                    ul.innerHTML += `
                        <li>
                            <div style="flex: 1;">
                                <div style="margin-bottom: 4px;">${pinIcon} <b>${item.title}</b> <span style="font-size:0.8em; color:#aaa; margin-left:5px;">${dateStr}</span></div>
                                <div style="color:#555; white-space: pre-wrap;">${item.content}</div>
                            </div>
                            <div class="notice-btn-group">
                                <button class="btn-edit" onclick="editMode(${item.id})">수정</button>
                                <button class="btn-del" onclick="deleteNotice(${item.id})">삭제</button>
                            </div>
                        </li>`;
                });
            });
        }

        function saveNotice() {
            const id = document.getElementById('n-id').value;
            const title = document.getElementById('n-title').value;
            const content = document.getElementById('n-content').value;
            const isPinned = document.getElementById('n-pinned').checked;
            
            if(!title || !content) return alert("제목과 내용을 입력하세요.");
            
            const url = id ? '/waiting/notice/update' : '/waiting/notice/create';
            fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id, storeId: storeId, title: title, content: content, isPinned: isPinned }) })
            .then(res => { 
                if(res.ok) { 
                    alert(id ? "수정되었습니다." : "등록되었습니다."); 
                    cancelEditMode(); 
                    loadNotices(); // 저장 후 목록 갱신
                } else alert("처리 실패"); 
            });
        }

        function deleteNotice(id) {
            if(!confirm("정말 삭제하시겠습니까?")) return;
            fetch(`/waiting/notice/delete/${id}`, { method: 'POST' })
            .then(res => { 
                if(res.ok) { 
                    loadNotices(); 
                    cancelEditMode(); 
                } else alert("삭제 실패"); 
            });
        }

        function editMode(id) {
            const item = loadedNotices.find(n => n.id === id);
            if(!item) return;
            // 수정 시 게시판이 닫혀있으면 열어줌
            const body = document.getElementById('notice-body');
            if(body.style.display === 'none') toggleNoticeBoard();

            document.getElementById('n-id').value = item.id;
            document.getElementById('n-title').value = item.title;
            document.getElementById('n-content').value = item.content;
            document.getElementById('n-pinned').checked = item.pinned;
            document.getElementById('btn-save-notice').innerText = "수정 저장";
            document.getElementById('btn-save-notice').style.backgroundColor = "#0984e3";
            document.getElementById('btn-cancel-edit').style.display = "inline-block";
            document.getElementById('n-title').focus();
        }

        function cancelEditMode() {
            document.getElementById('n-id').value = "";
            document.getElementById('n-title').value = "";
            document.getElementById('n-content').value = "";
            document.getElementById('n-pinned').checked = false;
            document.getElementById('btn-save-notice').innerText = "게시글 등록";
            document.getElementById('btn-save-notice').style.backgroundColor = "#636e72";
            document.getElementById('btn-cancel-edit').style.display = "none";
        }

        // --- 로그 조회 ---
        function toggleLogs() {
            const container = document.getElementById('log-container');
            if (container.style.display === 'none') { container.style.display = 'block'; loadLogs(); } else container.style.display = 'none';
        }
        function loadLogs() {
            fetch(`/waiting/logs?storeId=${storeId}`).then(r => r.json()).then(list => {
                const ul = document.getElementById('log-list');
                ul.innerHTML = "";
                if(list.length === 0) { ul.innerHTML = "<li>기록된 활동이 없습니다.</li>"; return; }
                list.forEach(item => {
                    const date = item.regDate ? item.regDate.replace('T', ' ') : '-';
                    let color = '#fff';
                    if(item.actionType === 'CALL') color = '#fab1a0'; 
                    else if(item.actionType === 'ENTER') color = '#55efc4';
                    else if(item.actionType === 'CANCEL') color = '#ff7675'; 
                    else if(item.actionType === 'TOGGLE') color = '#74b9ff';
                    
                    ul.innerHTML += `<li style="margin-bottom: 4px;"><span style="color: #b2bec3;">[${date}]</span> <span style="font-weight: bold; color: ${color}; width: 60px; display:inline-block;">${item.actionType}</span> <span>${item.logMessage}</span></li>`;
                });
            });
        }

        // --- 기타 기능 ---
        function checkStatus() { fetch(`/waiting/store-info?storeId=${storeId}`).then(r => r.json()).then(s => updateStatusUI(s.waitingOpen)); }
        function toggleStatus() { fetch(`/waiting/toggle?storeId=${storeId}`, { method: 'POST' }).then(r => r.json()).then(o => { updateStatusUI(o); alert(o ? "접수 시작" : "접수 마감"); }); }
        function updateStatusUI(isOpen) {
            const btn = document.getElementById('btn-status');
            if (isOpen) { btn.innerText = "🟢 접수 중 (클릭시 마감)"; btn.className = "btn-toggle on"; }
            else { btn.innerText = "🔴 접수 마감 (클릭시 오픈)"; btn.className = "btn-toggle off"; }
        }
        function sendWsNotice() {
            const content = document.getElementById('ws-content').value;
            if(!content) return alert("내용 입력");
            fetch(`/waiting/notice`, { method: 'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:`content=${content}`})
            .then(() => { alert("전송 완료"); document.getElementById('ws-content').value=''; });
        }
        function loadList() {
            fetch(`/waiting/list?storeId=${storeId}`).then(r => r.json()).then(list => {
                const tbody = document.getElementById('list-body');
                tbody.innerHTML = '';
                if(list.length===0) { tbody.innerHTML='<tr><td colspan="6" style="padding:30px; color:#aaa;">대기 손님 없음</td></tr>'; return;}
                list.forEach(item => {
                    let btns = '';
                    if(item.status==='WAITING') btns=`<button class="btn-call" onclick="action('call',${item.id})">🔔 호출</button><button class="btn-reject" onclick="action('reject',${item.id})">취소</button>`;
                    else if(item.status==='CALLED') btns=`<button class="btn-enter" onclick="action('enter',${item.id})">✅ 입장</button><button class="btn-reject" onclick="action('reject',${item.id})">취소</button>`;
                    
                    const row=`<tr><td><b>${item.waitingNumber}번</b></td><td>${item.memberName||'비회원'}</td><td>${item.memberPhone||'-'}</td><td>${item.teamSize}명</td><td><span class="status-badge status-${item.status}">${item.status}</span></td><td>${btns}</td></tr>`;
                    tbody.innerHTML+=row;
                });
            });
        }
        function action(type, id) { 
            if(!confirm("처리하시겠습니까?")) return; 
            fetch(`/waiting/${type}/${id}`, {method:'POST'}).then(r=>{if(r.ok)loadList();}); 
        }
        
        
        
        // --- 영업 시간 저장 ---
        function saveSchedule() {
            // 1. 선택된 요일 가져오기
            const checkboxes = document.querySelectorAll('input[name="days"]:checked');
            if (checkboxes.length === 0) return alert("요일을 하나 이상 선택해주세요.");
            
            const days = Array.from(checkboxes).map(cb => parseInt(cb.value));
            
            // 2. 시간 값 가져오기
            const openTime = document.getElementById('sch-open').value;
            const closeTime = document.getElementById('sch-close').value;
            const breakStart = document.getElementById('sch-bs').value;
            const breakEnd = document.getElementById('sch-be').value;
            const isHoliday = document.getElementById('sch-holiday').checked;

            if (!openTime || !closeTime) return alert("오픈/마감 시간을 입력하세요.");

            // 3. 전송 데이터 구성
            const payload = {
                storeId: storeId,
                days: days,
                openTime: openTime,
                closeTime: closeTime,
                breakStart: breakStart,
                breakEnd: breakEnd,
                isOpen: isHoliday ? "N" : "Y" // 휴무 체크하면 isOpen=N
            };

            // 4. API 호출
            fetch('/waiting/schedule/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (res.ok) alert("영업 시간이 저장되었습니다.");
                else alert("저장 실패");
            });
        }
    </script>
</body>
</html>
