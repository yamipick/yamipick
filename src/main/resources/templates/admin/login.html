<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 공통 CSS (색상 테마 활용) -->
    <link href="/css/admin.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .login-box { 
            width: 400px; 
            padding: 40px; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        .login-title {
            color: #008080; /* Teal Color */
            font-weight: bold;
        }
        .btn-primary {
            background-color: #008080;
            border-color: #008080;
        }
        .btn-primary:hover {
            background-color: #006666;
        }
    </style>
</head>
<body>

<div class="login-box">
    <div class="text-center mb-4">
        <h3 class="login-title"><i class="fas fa-utensils me-2"></i>Yamipick</h3>
        <p class="text-muted">Administrator Login</p>
    </div>
    
    <div th:if="${param.error}" class="alert alert-danger text-center">
        아이디 또는 비밀번호가 잘못되었습니다.
    </div>

    <form action="/loginProc" method="post">
        <div class="mb-3">
            <label class="form-label fw-bold">아이디</label>
            <input type="text" name="username" class="form-control" placeholder="Admin ID" required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-bold">비밀번호</label>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">로그인</button>
    </form>
    
    <div class="text-center mt-3">
        <a href="/" class="text-decoration-none small text-muted">메인 페이지로 돌아가기</a>
    </div>
</div>

</body>
</html>
