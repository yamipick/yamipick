<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - Yamipick</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/common.css" rel="stylesheet"> <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .login-header {
            background-color: #ff5722; /* 야미픽 포인트 컬러 */
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .login-body {
            padding: 40px 30px;
            background: white;
        }
        .form-control {
            height: 50px;
            border-radius: 8px;
        }
        .btn-login {
            background-color: #ff5722;
            border: none;
            height: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .btn-login:hover {
            background-color: #e64a19;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h2 class="fw-bold m-0">YamiPick</h2>
        <p class="mb-0 opacity-75">맛집 예약의 시작</p>
    </div>
    
    <div class="login-body">
        
        <div th:if="${param.error}" class="alert alert-danger text-center p-2 mb-4 small" role="alert">
            <i class="fas fa-exclamation-circle me-1"></i>
            <span th:text="${param.exception}">로그인 실패</span>
        </div>

        <div th:if="${param.logout}" class="alert alert-success text-center p-2 mb-4 small" role="alert">
            로그아웃 되었습니다.
        </div>

        <form action="/loginProc" method="post">
            
            <div class="mb-3">
                <label class="form-label text-muted small">아이디</label>
                <input type="text" name="username" class="form-control" placeholder="ID를 입력하세요" required autofocus>
            </div>
            
            <div class="mb-4">
                <label class="form-label text-muted small">비밀번호</label>
                <input type="password" name="password" class="form-control" placeholder="비밀번호를 입력하세요" required>
            </div>
            
            <div class="d-grid mb-4">
                <button type="submit" class="btn btn-primary btn-login">로그인</button>
            </div>

            <div class="text-center d-flex justify-content-between text-decoration-none small">
                <a href="/join" class="text-muted">회원가입</a>
                <div>
                    <a href="#" class="text-muted">아이디 찾기</a>
                    <span class="mx-1">|</span>
                    <a href="#" class="text-muted">비밀번호 찾기</a>
                </div>
            </div>
            
        </form>
    </div>
</div>

</body>
</html>
