<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 관리 - Yamipick Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="/css/admin.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{admin/common/header :: header}"></div>

<div class="admin-content">
    <div class="container-fluid">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark"><i class="fas fa-bullhorn me-2 text-primary"></i>공지사항 관리</h2>
            <a href="/admin/notice/write" class="btn btn-primary shadow-sm">
                <i class="fas fa-pen me-1"></i> 공지 등록
            </a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover table-bordered m-0 align-middle text-center">
                    <thead>
                        <tr>
                            <th width="8%">No</th>
                            <th width="45%">제목</th>
                            <th width="12%">작성자</th>
                            <th width="15%">작성일</th>
                            <th width="10%">조회수</th>
                            <th width="10%">관리</th> </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${list.isEmpty()}">
                            <td colspan="6" class="py-5 text-muted"> <i class="fas fa-folder-open fa-2x mb-3 d-block"></i>
                                등록된 공지사항이 없습니다.
                            </td>
                        </tr>
                        
                        <tr th:each="notice : ${list}">
                            <td th:text="${notice.seqNotice}">1</td>
                            <td class="text-start ps-4">
							    <a th:href="@{/admin/notice/edit/{seq}(seq=${notice.seqNotice})}" 
							       class="text-decoration-none text-dark fw-bold hover-link">
							        [[${notice.title}]]
							    </a>
							    <i th:if="${notice.filePath != null}" class="fas fa-paperclip text-muted ms-1 small"></i>
							</td>
                            <td th:text="${notice.writer != null ? notice.writer.name : '관리자'}">관리자</td>
                            
                            <td th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd')}">2024-01-01</td>
                            
                            <td th:text="${notice.viewCount != null ? notice.viewCount : 0}">0</td>
                            
                            <td>
                                <a th:href="@{/admin/notice/edit/{seq}(seq=${notice.seqNotice})}" 
                                   class="btn btn-sm btn-outline-primary me-1" title="수정">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{/admin/notice/delete/{seq}(seq=${notice.seqNotice})}" 
                                   class="btn btn-sm btn-outline-danger" 
                                   onclick="return confirm('정말 삭제하시겠습니까?');" title="삭제">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin.js"></script>

</body>
</html>
