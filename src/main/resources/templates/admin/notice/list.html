<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 관리 - Yamipick Admin</title>
    <!-- 부트스트랩 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 공통 CSS -->
    <link href="/css/admin.css" rel="stylesheet">
</head>
<body>

<!-- ★ 1. 헤더 (Navbar) -->
<div th:replace="~{admin/common/header :: header}"></div>

<!-- ★ 2. 메인 컨텐츠 -->
<div class="admin-content">
    <div class="container-fluid">
        
        <!-- 타이틀 영역 -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark"><i class="fas fa-bullhorn me-2 text-primary"></i>공지사항 관리</h2>
            <a href="/admin/notice/write" class="btn btn-primary shadow-sm">
                <i class="fas fa-pen me-1"></i> 공지 등록
            </a>
        </div>

        <!-- 리스트 테이블 카드 -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover table-bordered m-0 align-middle text-center">
                    <thead>
                        <tr>
                            <th width="10%">No</th>
                            <th width="50%">제목</th>
                            <th width="15%">작성자</th>
                            <th width="15%">작성일</th>
                            <th width="10%">조회수</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- 데이터 없을 때 -->
                        <tr th:if="${list.isEmpty()}">
                            <td colspan="5" class="py-5 text-muted">
                                <i class="fas fa-folder-open fa-2x mb-3 d-block"></i>
                                등록된 공지사항이 없습니다.
                            </td>
                        </tr>
                        
                        <!-- 데이터 반복 -->
                        <tr th:each="notice : ${list}">
                            <td th:text="${notice.seqNotice}">1</td>
                            <td class="text-start ps-4">
                                <a th:href="@{/admin/notice/view(seq=${notice.seqNotice})}" 
                                   class="text-decoration-none text-dark fw-bold hover-link"
                                   th:text="${notice.title}">제목</a>
                                <!-- 첨부파일 아이콘 -->
                                <i th:if="${notice.filePath != null}" class="fas fa-paperclip text-muted ms-1 small"></i>
                            </td>
                            <!-- 작성자 이름 (null 방지) -->
                            <td th:text="${notice.writer != null ? notice.writer.name : '알수없음'}">관리자</td>
                            <td th:text="${notice.createdAt}">2024-01-01</td>
                            <td th:text="${notice.viewCount}">0</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- 부트스트랩 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- 공통 JS -->
<script src="/js/admin.js"></script>

</body>
</html>
