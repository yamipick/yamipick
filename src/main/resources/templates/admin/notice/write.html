<!DOCTYPE html>
<html>
<head><title>공지사항 등록</title></head>
<body>
    <h2>✏️ 공지사항 등록</h2>
    <form action="/admin/notice/write" method="post" enctype="multipart/form-data">
        <p>제목: <input type="text" name="title" required></p>
        <p>내용: <textarea name="content" rows="5" cols="50" required></textarea></p>
        <p>파일: <input type="file" name="file"></p>
        <button type="submit">등록</button>
    </form>
    <a href="/admin/notice/list">목록으로</a>
</body>
</html>
