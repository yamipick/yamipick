<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="/css/admin.css" rel="stylesheet">
</head>
<body>

<div class="admin-wrapper">
    <div class="admin-sidebar">
        <div th:replace="~{admin/common/sidebar :: sidebar}"></div>
    </div>

    <div class="admin-content">
        <div class="container-fluid">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-dark"><i class="fas fa-pen-nib me-2 text-primary"></i>공지사항 등록</h2>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form action="/admin/notice/write" method="post" enctype="multipart/form-data">
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">제목</label>
                            <input type="text" name="title" class="form-control" placeholder="제목을 입력하세요" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">내용</label>
                            <textarea name="content" class="form-control" rows="10" placeholder="내용을 입력하세요" required></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">첨부파일</label>
                            <input type="file" name="file" class="form-control">
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="/admin/notice/list" class="btn btn-secondary">취소</a>
                            <button type="submit" class="btn btn-primary px-4">등록하기</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
