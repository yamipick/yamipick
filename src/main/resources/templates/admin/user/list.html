<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 관리 - Yamipick Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="/css/admin.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{admin/common/header :: header}"></div>

<div class="admin-content">
    <div class="container-fluid">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark"><i class="fas fa-users me-2 text-primary"></i>회원 관리</h2>
            <form action="/admin/user/list" method="get" class="d-flex">
                <input type="text" name="keyword" class="form-control me-2" placeholder="아이디/이름 검색" th:value="${keyword}">
                <button type="submit" class="btn btn-dark">검색</button>
            </form>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover table-bordered m-0 align-middle text-center">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>아이디</th>
                            <th>이름</th>
                            <th>닉네임</th>
                            <th>가입일</th>
                            <th>상태</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${list == null or list.isEmpty()}">
                            <td colspan="7" class="py-5 text-muted">검색 결과가 없습니다.</td>
                        </tr>
                        <tr th:each="user : ${list}">
                            <td th:text="${user.seqUser}">1</td>
                            <td class="fw-bold" th:text="${user.userId}">user1234</td>
                            <td th:text="${user.name}">홍길동</td>
                            <td><span class="badge bg-light text-dark border" th:text="${user.nickname}">닉네임</span></td>
                            <td th:text="${user.createdAt}">2024-01-01</td>
                            <td>
                                <span class="badge rounded-pill" 
                                      th:classappend="${user.statusUser == 'ACTIVE' ? 'bg-success' : 'bg-danger'}"
                                      th:text="${user.statusUser}">ACTIVE</span>
                            </td>
                            <td>
                                <!-- admin.js의 openUserStatusModal 함수 호출 -->
                                <button type="button" class="btn btn-sm btn-outline-dark"
                                        th:onclick="openUserStatusModal([[${user.seqUser}]], [[${user.userId}]], [[${user.statusUser}]])">
                                    <i class="fas fa-cog"></i> 관리
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- 페이징은 생략 (필요하면 추가) -->

    </div>
</div>

<!-- 상태 변경 모달 -->
<div class="modal fade" id="statusModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold">회원 상태 변경</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form action="/admin/user/status" method="post">
                <div class="modal-body">
                    <input type="hidden" id="modalSeqUser" name="seqUser">
                    <div class="mb-3">
                        <label class="form-label">대상 회원 ID</label>
                        <input type="text" id="modalUserId" class="form-control" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">상태 변경</label>
                        <select class="form-select" id="modalStatus" name="status">
                            <option value="ACTIVE">활동중 (ACTIVE)</option>
                            <option value="SUSPENDED">정지 (SUSPENDED)</option>
                            <option value="BLIND">블라인드 (BLIND)</option>
                            <option value="WITHDRAWN">탈퇴 (WITHDRAWN)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">변경 사유</label>
                        <textarea class="form-control" name="reason" rows="3" placeholder="예: 욕설 사용으로 정지"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary">저장하기</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
