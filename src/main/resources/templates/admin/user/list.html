<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; }
        .table th { background-color: #008080; color: white; }
        .pagination .page-link { color: #008080; }
        .pagination .active .page-link { background-color: #008080; border-color: #008080; color: white; }
    </style>
</head>
<body>

<div class="container-fluid mt-5 px-5">
    
    <!-- 타이틀 & 검색창 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark"><i class="fas fa-users me-2"></i>회원 관리</h2>
        
        <form action="/admin/user/list" method="get" class="d-flex">
            <input type="text" name="keyword" class="form-control me-2" placeholder="아이디/이름 검색" th:value="${keyword}">
            <button type="submit" class="btn btn-dark">검색</button>
        </form>
    </div>

    <!-- 회원 리스트 테이블 -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-bordered m-0 align-middle text-center">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>아이디</th>
                        <th>이름</th>
                        <th>닉네임</th>
                        <th>가입일</th>
                        <th>상태</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${list.isEmpty()}">
                        <td colspan="7" class="py-5 text-muted">검색 결과가 없습니다.</td>
                    </tr>
                    
                    <tr th:each="user : ${list}">
                        <td th:text="${user.seqUser}">1</td>
                        <td class="fw-bold" th:text="${user.userId}">user1234</td>
                        <td th:text="${user.name}">홍길동</td>
                        <td th:text="${user.nickname}">닉네임</td>
                        <td th:text="${user.createdAt}">2024-01-01</td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${user.statusUser == 'ACTIVE' ? 'bg-success' : 'bg-danger'}"
                                  th:text="${user.statusUser}">ACTIVE</span>
                        </td>
                        <td>
                            <!-- ★ 관리 버튼 클릭 시 모달 오픈 (데이터 전달) -->
                            <button type="button" class="btn btn-sm btn-outline-dark"
                                    th:onclick="openModal([[${user.seqUser}]], [[${user.userId}]], [[${user.statusUser}]])">
                                <i class="fas fa-cog"></i> 관리
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 페이징 (Pagination) -->
    <div class="mt-4 d-flex justify-content-center" th:if="${!list.isEmpty()}">
        <nav>
            <ul class="pagination">
                <li class="page-item" th:classappend="${list.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/user/list(page=${list.number - 1}, keyword=${keyword})}">Prev</a>
                </li>
                <li class="page-item" th:each="page : ${#numbers.sequence(0, list.totalPages - 1)}"
                    th:classappend="${page == list.number} ? 'active'">
                    <a class="page-link" th:text="${page + 1}" 
                       th:href="@{/admin/user/list(page=${page}, keyword=${keyword})}">1</a>
                </li>
                <li class="page-item" th:classappend="${list.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/user/list(page=${list.number + 1}, keyword=${keyword})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<!-- ★ 상태 변경 모달 (Modal) -->
<div class="modal fade" id="statusModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">회원 상태 변경</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <!-- 폼 전송 -->
            <form action="/admin/user/status" method="post">
                <div class="modal-body">
                    <!-- 숨겨진 값 (User Sequence) -->
                    <input type="hidden" id="modalSeqUser" name="seqUser">
                    
                    <div class="mb-3">
                        <label class="form-label">대상 회원 ID</label>
                        <input type="text" id="modalUserId" class="form-control" readonly>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">상태 변경</label>
                        <select class="form-select" id="modalStatus" name="status">
                            <option value="ACTIVE">활동중 (ACTIVE)</option>
                            <option value="BLIND">정지 (BLIND)</option>
                            <option value="WITHDRAWN">탈퇴 (WITHDRAWN)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">변경 사유 (기록용)</label>
                        <textarea class="form-control" name="reason" rows="3" placeholder="예: 욕설 사용으로 인한 7일 정지"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary" style="background-color: #008080; border:none;">저장하기</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 부트스트랩 JS (모달 작동용) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- ★ 자바스크립트 로직 -->
<script>
    function openModal(seqUser, userId, status) {
        // 1. 모달의 input 태그들에 값 채워넣기
        document.getElementById('modalSeqUser').value = seqUser;
        document.getElementById('modalUserId').value = userId;
        document.getElementById('modalStatus').value = status;

        // 2. 모달 띄우기
        var myModal = new bootstrap.Modal(document.getElementById('statusModal'));
        myModal.show();
    }
</script>

</body>
</html>
