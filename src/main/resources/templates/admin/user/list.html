<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 관리 - Yamipick Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="/css/admin.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{admin/common/header :: header}"></div>

<div class="admin-content">
    <div class="container-fluid">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark"><i class="fas fa-users me-2 text-primary"></i>회원 관리</h2>
            <form action="/admin/user/list" method="get" class="d-flex">
                <input type="text" name="keyword" class="form-control me-2" placeholder="아이디/이름 검색" th:value="${keyword}">
                <button type="submit" class="btn btn-dark">검색</button>
            </form>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover table-bordered m-0 align-middle text-center">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>아이디</th>
                            <th>이름</th>
                            <th>가입일</th>
                            <th>상태</th>
                            <th>정지 해제일</th> <th>관리</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${list == null or list.isEmpty()}">
                            <td colspan="7" class="py-5 text-muted">검색 결과가 없습니다.</td>
                        </tr>
                        <tr th:each="user : ${list}">
                            <td th:text="${user.seqUser}">1</td>
                            <td class="fw-bold" th:text="${user.userId}">user1</td>
                            <td th:text="${user.name}">홍길동</td>
                            <td th:text="${user.createdAt}">2024-01-01</td>
                            <td>
                                <span class="badge rounded-pill" 
                                      th:classappend="${user.statusUser == 'ACTIVE' ? 'bg-success' : (user.statusUser == 'SUSPENDED' ? 'bg-danger' : 'bg-secondary')}"
                                      th:text="${user.statusUser}">ACTIVE</span>
                            </td>
                            <td>
                                <span th:if="${user.suspendedUntil != null}" class="text-danger small fw-bold">
                                    ~ <span th:text="${user.suspendedUntil}">2025-12-31</span>
                                </span>
                                <span th:unless="${user.suspendedUntil != null}" class="text-muted small">-</span>
                            </td>
                            <td>
                                <button type="button" class="btn btn-sm btn-outline-dark"
                                        th:onclick="openUserStatusModal([[${user.seqUser}]], [[${user.userId}]], [[${user.statusUser}]])">
                                    <i class="fas fa-cog"></i> 설정
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
    </div>
</div>

<div class="modal fade" id="statusModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold">회원 상태 변경</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form action="/admin/user/status" method="post">
                <div class="modal-body">
                    <input type="hidden" id="modalSeqUser" name="seqUser">
                    
                    <div class="mb-3">
                        <label class="form-label">대상 회원</label>
                        <input type="text" id="modalUserId" class="form-control bg-light" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">상태 변경</label>
                        <select class="form-select" id="modalStatus" name="status" onchange="toggleDuration()">
                            <option value="ACTIVE">✅ 활동중 (정지 해제)</option>
                            <option value="SUSPENDED">⛔ 이용 정지</option>
                            <option value="WITHDRAWN">💀 강제 탈퇴</option>
                        </select>
                    </div>

                    <div class="mb-3 bg-light p-3 rounded" id="durationArea" style="display:none;">
                        <label class="form-label text-danger fw-bold">정지 기간 선택</label>
                        <select class="form-select border-danger" name="duration">
                            <option value="3">3일 정지</option>
                            <option value="7">7일 정지</option>
                            <option value="30">30일 정지</option>
                            <option value="9999">영구 정지 (무기한)</option>
                        </select>
                        <div class="form-text small">선택한 기간 동안 로그인이 차단됩니다.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">변경 사유 (로그 기록용)</label>
                        <textarea class="form-control" name="reason" rows="2" placeholder="예: 요청에 의한 정지 해제"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary">변경 저장</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin.js"></script>
<script>
    // 모달 데이터 바인딩
    function openUserStatusModal(seq, id, status) {
        document.getElementById('modalSeqUser').value = seq;
        document.getElementById('modalUserId').value = id;
        document.getElementById('modalStatus').value = status;
        
        // 모달 열 때 현재 상태에 맞춰 기간박스 보일지 말지 결정
        toggleDuration();
        
        const modal = new bootstrap.Modal(document.getElementById('statusModal'));
        modal.show();
    }

    // ★ 상태가 '정지(SUSPENDED)'일 때만 기간 선택박스 보여주기
    function toggleDuration() {
        const status = document.getElementById('modalStatus').value;
        const durationArea = document.getElementById('durationArea');
        
        if (status === 'SUSPENDED') {
            durationArea.style.display = 'block';
        } else {
            durationArea.style.display = 'none';
        }
    }
</script>
</body>
</html>
