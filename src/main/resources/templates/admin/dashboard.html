<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yamipick Admin Dashboard</title>
    <!-- 부트스트랩 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 아이콘 (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --primary-color: #008080; /* 보여주신 이미지의 청록색 (Teal) */
            --bg-color: #f0f2f5;
            --card-shadow: 0 2px 10px rgba(0,0,0,0.05);
        }
        
        body { background-color: var(--bg-color); font-family: 'Noto Sans KR', sans-serif; }
        
        /* 상단 헤더 스타일 */
        .dashboard-header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px 0;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 카드 공통 스타일 */
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
            background: white;
        }
        .card-header {
            background: transparent;
            border-bottom: 1px solid #eee;
            font-weight: 700;
            color: #333;
            padding: 15px 20px;
        }
        
        /* 프로그레스 바 커스텀 */
        .progress { height: 8px; border-radius: 4px; background-color: #e9ecef; }
        .progress-bar { background-color: var(--primary-color); }

        /* KPI 숫자 스타일 */
        .kpi-value { font-size: 2rem; font-weight: bold; color: var(--primary-color); }
        .kpi-label { color: #666; font-size: 0.9rem; }
        
        /* 도넛 차트 중앙 텍스트 */
        .donut-inner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .donut-percent { font-size: 1.5rem; font-weight: bold; color: var(--primary-color); }
    </style>
</head>
<body>

<!-- 1. 헤더 영역 -->
<div class="dashboard-header">
    <div class="container-fluid px-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="m-0"><i class="fas fa-chart-line me-2"></i>Yamipick CEO Dashboard</h2>
            <div>
                <span class="me-3"><i class="fas fa-user-circle me-1"></i> 관리자님 환영합니다</span>
                <a href="/logout" class="btn btn-sm btn-light text-teal fw-bold">Logout</a>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid px-4">
    
    <!-- 2. 상단 요약 (Financial Segment 느낌) -->
    <div class="row">
        <!-- (1) 플랫폼 현황 테이블 스타일 -->
        <div class="col-lg-5">
            <div class="card h-100">
                <div class="card-header">Platform Status (플랫폼 현황)</div>
                <div class="card-body">
                    <!-- 유저 현황 -->
                    <div class="d-flex justify-content-between mb-1">
                        <span>전체 회원수</span>
                        <span class="fw-bold" th:text="${totalUser} + ' 명'">0 명</span>
                    </div>
                    <div class="progress mb-3">
                        <div class="progress-bar" style="width: 70%"></div> <!-- 예시로 70% 채움 -->
                    </div>

                    <!-- 오늘 가입 -->
                    <div class="d-flex justify-content-between mb-1">
                        <span>오늘 신규 가입</span>
                        <span class="fw-bold" th:text="${todayJoin} + ' 명'">0 명</span>
                    </div>
                    <div class="progress mb-3">
                        <div class="progress-bar bg-info" style="width: 30%"></div>
                    </div>

                    <!-- 매출 목표 달성률 (가짜 데이터) -->
                    <div class="d-flex justify-content-between mb-1">
                        <span>이번달 매출 목표 달성</span>
                        <span class="fw-bold" 
                              th:text="${#numbers.formatInteger(currentRevenue, 0, 'COMMA')} + ' / ' + ${#numbers.formatInteger(targetRevenue, 0, 'COMMA')}">
                        </span>
                    </div>
                    <div class="progress">
                        <!-- 실제 비율 계산해서 width 적용 -->
                        <div class="progress-bar bg-warning" role="progressbar" 
                             th:style="'width:' + ${currentRevenue * 100 / targetRevenue} + '%'"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- (2) 핵심 KPI (큰 숫자) -->
        <div class="col-lg-2">
            <div class="card h-100 text-center py-3">
                <div class="card-body d-flex flex-column justify-content-center">
                    <div class="kpi-label">Today's Visits</div>
                    <div class="kpi-value my-2" 
                         th:text="${visitData != null and !visitData.isEmpty() ? visitData.get(visitData.size()-1) : 0}">
                        0
                    </div>
                    <div class="text-muted small">오늘 방문자</div>
                </div>
            </div>
        </div>
        
        <div class="col-lg-2">
            <div class="card h-100 text-center py-3">
                <div class="card-body d-flex flex-column justify-content-center">
                    <div class="kpi-label">Active Stores</div>
                    <div class="kpi-value my-2 text-warning">189</div> <!-- 임시 숫자 -->
                    <div class="text-muted small">입점 식당 수</div>
                </div>
            </div>
        </div>

        <!-- (3) 바 차트 (Revenue) -->
        <div class="col-lg-3">
            <div class="card h-100">
                <div class="card-header">Weekly Revenue</div>
                <div class="card-body">
                    <canvas id="revenueChart" height="150"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 메인 차트 영역 -->
    <div class="row">
        <!-- (1) 방문자 트렌드 (Line Area Chart) -->
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-users me-2"></i>Traffic Trends (방문자 추이)
                </div>
                <div class="card-body">
                    <canvas id="visitChart" height="80"></canvas>
                </div>
            </div>
        </div>

        <!-- (2) 운영 지표 (도넛 차트 4개) -->
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header">Operation Metrics</div>
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col-6 mb-4">
                            <div style="position: relative; height: 100px; width: 100px; margin: 0 auto;">
                                <canvas id="donut1"></canvas>
                                <div class="donut-inner"><div class="donut-percent">73%</div></div>
                            </div>
                            <div class="mt-2 small fw-bold">예약 이행률</div>
                        </div>
                        <div class="col-6 mb-4">
                            <div style="position: relative; height: 100px; width: 100px; margin: 0 auto;">
                                <canvas id="donut2"></canvas>
                                <div class="donut-inner"><div class="donut-percent text-danger">12%</div></div>
                            </div>
                            <div class="mt-2 small fw-bold">노쇼 비율</div>
                        </div>
                        <div class="col-6">
                            <div style="position: relative; height: 100px; width: 100px; margin: 0 auto;">
                                <canvas id="donut3"></canvas>
                                <div class="donut-inner"><div class="donut-percent text-success">98%</div></div>
                            </div>
                            <div class="mt-2 small fw-bold">서버 가동률</div>
                        </div>
                        <div class="col-6">
                            <div style="position: relative; height: 100px; width: 100px; margin: 0 auto;">
                                <canvas id="donut4"></canvas>
                                <div class="donut-inner"><div class="donut-percent text-warning">45%</div></div>
                            </div>
                            <div class="mt-2 small fw-bold">광고 전환율</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. 하단 랭킹 영역 -->
    <div class="row mb-5">
        <div class="col-12">
            <div class="card">
                <div class="card-header">🔥 Top Popular Stores (인기 식당)</div>
                <div class="card-body">
                    <canvas id="rankChart" height="60"></canvas>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Script 영역 -->
<script th:inline="javascript">
    /*<![CDATA[*/
    
    // 1. 데이터 가져오기
    const visitLabels = /*[[${visitLabels ?: {}}]]*/ [];
    const visitData = /*[[${visitData ?: {}}]]*/ [];
    const rankLabels = /*[[${rankLabels ?: {}}]]*/ [];
    const rankData = /*[[${rankData ?: {}}]]*/ [];

    // 공통 컬러셋
    const tealColor = '#008080';
    const lightTeal = 'rgba(0, 128, 128, 0.2)';
    const orangeColor = '#FF9F40';

    // 2. 방문자 차트 (Area Chart 느낌)
    if(visitLabels.length > 0) {
        new Chart(document.getElementById('visitChart'), {
            type: 'line',
            data: {
                labels: visitLabels,
                datasets: [{
                    label: 'Visits',
                    data: visitData,
                    borderColor: tealColor,
                    backgroundColor: lightTeal,
                    borderWidth: 2,
                    fill: true, // 영역 채우기
                    tension: 0.4, // 부드러운 곡선
                    pointRadius: 3
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: { 
                    x: { grid: { display: false } },
                    y: { beginAtZero: true }
                }
            }
        });
    }

    // 3. 인기 식당 차트 (Bar Chart)
    if(rankLabels.length > 0) {
        new Chart(document.getElementById('rankChart'), {
            type: 'bar',
            data: {
                labels: rankLabels,
                datasets: [{
                    label: 'Views',
                    data: rankData,
                    backgroundColor: tealColor,
                    borderRadius: 5 // 막대 둥글게
                }]
            },
            options: {
                indexAxis: 'y', // 가로 막대
                plugins: { legend: { display: false } },
                scales: { x: { grid: { display: false } } }
            }
        });
    }

    // 4. 우측 상단 미니 바 차트 (Revenue) - 가짜 데이터
    new Chart(document.getElementById('revenueChart'), {
        type: 'bar',
        data: {
            labels: ['M', 'T', 'W', 'T', 'F', 'S', 'S'],
            datasets: [
                {
                    label: 'Target',
                    data: [12, 19, 3, 5, 2, 3, 10],
                    backgroundColor: '#e9ecef',
                    barThickness: 10
                },
                {
                    label: 'Actual',
                    data: [10, 15, 8, 12, 5, 6, 8],
                    backgroundColor: orangeColor,
                    barThickness: 10
                }
            ]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: { x: { stacked: true, display: false }, y: { display: false } }
        }
    });

    // 5. 도넛 차트 생성 함수
    function createDonut(id, value, color) {
        new Chart(document.getElementById(id), {
            type: 'doughnut',
            data: {
                labels: ['Done', 'Left'],
                datasets: [{
                    data: [value, 100 - value],
                    backgroundColor: [color, '#e9ecef'],
                    borderWidth: 0,
                    cutout: '75%' // 가운데 구멍 크기
                }]
            },
            options: {
                plugins: { legend: { display: false }, tooltip: { enabled: false } }
            }
        });
    }

    // 도넛 4개 그리기
    createDonut('donut1', 73, tealColor);
    createDonut('donut2', 12, '#dc3545'); // Red
    createDonut('donut3', 98, '#198754'); // Green
    createDonut('donut4', 45, '#ffc107'); // Yellow

    /*]]>*/
</script>

</body>
</html>
