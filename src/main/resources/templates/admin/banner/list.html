<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>배너 관리 - Yamipick Admin</title>
    <!-- 부트스트랩 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; font-family: 'Noto Sans KR', sans-serif; }
        .table th { background-color: #343a40; color: white; border-color: #343a40; }
        .banner-img-preview { width: 150px; height: 80px; object-fit: cover; border-radius: 5px; border: 1px solid #ddd; }
        .form-label { font-weight: bold; }
    </style>
</head>
<body>

<div class="container-fluid mt-5 px-5">
    
    <!-- 1. 타이틀 영역 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark"><i class="fas fa-images me-2 text-primary"></i>배너 관리</h2>
        <!-- 등록 버튼 (모달 열기) -->
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addBannerModal">
            <i class="fas fa-plus me-1"></i> 배너 등록
        </button>
    </div>

    <!-- 2. 배너 리스트 테이블 -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover table-bordered m-0 align-middle text-center">
                <thead>
                    <tr>
                        <th width="5%">No</th>
                        <th width="20%">이미지</th>
                        <th width="30%">제목</th>
                        <th width="15%">등록일</th>
                        <th width="10%">노출 상태</th>
                        <th width="10%">관리</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 데이터 없을 때 -->
                    <tr th:if="${list.isEmpty()}">
                        <td colspan="6" class="py-5 text-muted">
                            <i class="fas fa-image fa-2x mb-3 d-block"></i>
                            등록된 배너가 없습니다.
                        </td>
                    </tr>
                    
                    <!-- 데이터 반복 출력 -->
                    <tr th:each="banner : ${list}">
                        <td th:text="${banner.seqBanner}">1</td>
                        <td>
                            <!-- 이미지 썸네일 -->
                            <!-- th:src에 실제 이미지 경로가 들어갑니다. -->
                            <img th:src="${banner.imgPath}" class="banner-img-preview" alt="배너 이미지">
                        </td>
                        <td class="fw-bold" th:text="${banner.title}">여름 이벤트 배너</td>
                        <!-- 날짜 포맷팅 -->
                        <td th:text="${#temporals.format(banner.createdAt, 'yyyy-MM-dd')}">2024-06-01</td>
                        <td>
                            <!-- 노출 여부 토글 버튼 (Form으로 처리) -->
                            <form action="/admin/banner/toggle" method="post" class="d-inline">
                                <input type="hidden" name="seqBanner" th:value="${banner.seqBanner}">
                                <!-- 현재 상태와 반대 값을 보냄 -->
                                <input type="hidden" name="isVisible" th:value="${banner.isVisible == 'Y' ? 'N' : 'Y'}">
                                <button type="submit" class="btn btn-sm" 
                                        th:classappend="${banner.isVisible == 'Y' ? 'btn-success' : 'btn-secondary'}"
                                        th:text="${banner.isVisible == 'Y' ? '노출중' : '숨김'}">
                                    노출중
                                </button>
                            </form>
                        </td>
                        <td>
                            <!-- 삭제 버튼 -->
                            <form action="/admin/banner/delete" method="post" class="d-inline" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                                <input type="hidden" name="seqBanner" th:value="${banner.seqBanner}">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="fas fa-trash-alt"></i> 삭제
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <div class="mt-3 text-muted small">
        <i class="fas fa-info-circle me-1"></i> 메인 페이지에는 '노출중(Y)' 상태인 배너만 최신순으로 표시됩니다.
    </div>

</div>

<!-- ★ 배너 등록 모달 (Modal) -->
<div class="modal fade" id="addBannerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold"><i class="fas fa-upload me-2"></i>새 배너 등록</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <!-- 파일 업로드 폼 (enctype 필수!) -->
            <form action="/admin/banner/add" method="post" enctype="multipart/form-data">
                <div class="modal-body">
                    
                    <div class="mb-3">
                        <label class="form-label">배너 제목 <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" placeholder="관리용 제목을 입력하세요" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">이미지 파일 <span class="text-danger">*</span></label>
                        <input type="file" name="file" class="form-control" accept="image/*" required>
                        <div class="form-text">권장 사이즈: 1920x400 (jpg, png)</div>
                    </div>
                    
                    <!-- (ERD에 링크, 순서가 없으므로 입력창 생략) -->
                    
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary">등록하기</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 부트스트랩 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
