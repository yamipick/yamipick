<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>배너 관리 - Yamipick Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="/css/admin.css" rel="stylesheet">
    <style>
        .banner-img-preview { width: 120px; height: 70px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div th:replace="~{admin/common/header :: header}"></div>

<div class="admin-content">
    <div class="container-fluid">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark"><i class="fas fa-images me-2 text-primary"></i>배너 관리</h2>
            <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#addBannerModal">
                <i class="fas fa-plus me-1"></i> 배너 등록
            </button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover table-bordered m-0 align-middle text-center">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>이미지</th>
                            <th>제목</th>
                            <th>상태</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${list == null or list.isEmpty()}">
                            <td colspan="6" class="py-5 text-muted">등록된 배너가 없습니다.</td>
                        </tr>
                        <tr th:each="banner : ${list}">
                            <td th:text="${banner.seqBanner}">1</td>
                            <td><img th:src="${banner.imgPath}" class="banner-img-preview"></td>
                            <td class="fw-bold" th:text="${banner.title}">제목</td>
                            <td>
                                <form action="/admin/banner/toggle" method="post" class="d-inline">
                                    <input type="hidden" name="seqBanner" th:value="${banner.seqBanner}">
                                    <input type="hidden" name="isVisible" th:value="${banner.isVisible == 'Y' ? 'N' : 'Y'}">
                                    <button type="submit" class="btn btn-sm" 
                                            th:classappend="${banner.isVisible == 'Y' ? 'btn-success' : 'btn-secondary'}"
                                            th:text="${banner.isVisible == 'Y' ? '노출중' : '숨김'}">노출중</button>
                                </form>
                            </td>
                            <td>
                                <form action="/admin/banner/delete" method="post" class="d-inline" onsubmit="return confirmDelete();">
                                    <input type="hidden" name="seqBanner" th:value="${banner.seqBanner}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fas fa-trash-alt"></i> 삭제</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- 배너 등록 모달 -->
<div class="modal fade" id="addBannerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold">새 배너 등록</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form action="/admin/banner/add" method="post" enctype="multipart/form-data">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">제목</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">이미지 파일</label>
                        <input type="file" name="file" class="form-control" accept="image/*" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary">등록하기</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
