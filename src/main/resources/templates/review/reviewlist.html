<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>YamiPick</title>

<style>

	/* 검색창 ------------------------------- */
	.search-box {
	    display: flex;
	    gap: 10px;
	}
	.search-box input {
	    flex: 1;
	    padding: 10px;
	    font-size: 16px;
	    border: 1px solid #aaa;
	    border-radius: 6px;
	}
	.search-btn {
	    padding: 10px 24px;
	    background: #4CAF50;
	    color: white;
	    border: none;
	    border-radius: 6px;
	    cursor: pointer;
	    font-size: 16px;
	    white-space: nowrap;
	}

	/* 공통 레이아웃 ------------------------ */
	.container { width: 1200px; margin: 0 auto; display: flex; gap: 20px; }
	.main { width: 75%; }
	.side { width: 25%; }

	.section { margin-bottom: 40px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
	.section h2 { margin-bottom: 15px; font-size: 20px; }

	/* 사이드 리스트 ------------------------ */
	.list-item {
		padding: 10px 0;
		border-bottom: 1px solid #ddd;
	}

	/* 정렬 메뉴 ------------------------ */
	.sort-menu {
	    display: flex;
	    align-items: center;
	    gap: 15px;
	    padding: 12px 16px;   /* 높이 ↓ */
    	margin-bottom: 20px;  /* 아래 공백 ↓ */
	}
	
	/* 정렬 기준 select */
	.sort-menu .sort-select {
	    padding: 6px 10px;
	    border: 1px solid #ccc;
	    background: #fff;
	    border-radius: 6px;
	    cursor: pointer;
	    font-size: 14px;
	}
	
	/* 사진 리뷰 체크박스 */
	.sort-menu .photo-filter {
	    display: flex;
	    align-items: center;
	    gap: 6px;
	    font-size: 14px;
	    cursor: pointer;
	}
	
	.sort-menu .photo-filter input {
	    cursor: pointer;
	}


	/* 리뷰 리스트 --------------------------- */
	.review-item {
		display: flex;
		gap: 15px;
		padding: 15px 0;
		border-bottom: 1px solid #ddd;
	}

	.thumb {
		width: 120px;
		height: 90px;
		background: #ccc;
		border-radius: 6px;
		flex-shrink: 0;
	}

	.no-img {
		background: #eee;
		display: flex;
		justify-content: center;
		align-items: center;
		color: #555;
		font-size: 13px;
	}

	.review-info h3 {
		margin: 0 0 6px 0;
		font-size: 18px;
	}

	.meta {
		font-size: 14px;
		color: #666;
		margin-bottom: 6px;
	}

	.content-preview {
		font-size: 14px;
		color: #333;
		line-height: 1.4;
	}
	
	/* 페이징 ------------------------ */
	.pagination {
	    display: flex;
	    justify-content: center;
	    gap: 8px;
	    margin-top: 25px;
	}
	
	.pagination a {
	    padding: 8px 12px;
	    border: 1px solid #ccc;
	    border-radius: 6px;
	    font-size: 14px;
	    text-decoration: none;
	    color: #333;
	}
	
	.pagination a.active {
	    background: #4CAF50;
	    color: white;
	    border-color: #4CAF50;
	}
	
	.pagination a:hover {
	    background: #eee;
	}
	

</style>
</head>
<body>

<!-- 검색창 -->
<div class="container">
    <div class="section" style="width: 100%; margin-top: 40px;">
        <div class="search-box">
            <input type="text" placeholder="리뷰 검색(가게명 / 키워드)">
            <button class="search-btn">검색</button>
        </div>
    </div>
</div>

<!-- 메인 + 사이드 -->
<div class="container">

    <!-- 메인 컨텐츠 -->
    <div class="main">

        <!-- 정렬 메뉴 -->
		<div class="section sort-menu">
		
		    <!-- 정렬 기준 선택 -->
		    <select class="sort-select">
		        <option value="latest">최신순</option>
		        <option value="views">조회수순</option>
		        <option value="rating-high">평점 높은 순</option>
		        <option value="rating-low">평점 낮은 순</option>
		    </select>
		
		    <!-- 사진 리뷰만 -->
		    <label class="photo-filter">
		        <input type="checkbox"> 사진 리뷰만
		    </label>
		
		</div>


        <!-- 검색 결과 리스트 -->
        <div class="section">

            <!-- 1 -->
            <div class="review-item">
                <div class="thumb"></div>
                <div class="review-info">
                    <h3>리뷰 제목 예시</h3>
                    <div class="meta">⭐ 4.5 / 작성자 홍길동 / 조회수 32</div>
                    <p class="content-preview">
                        여기에 리뷰 내용 일부가 2~3줄 정도 들어갑니다...
                    </p>
                </div>
            </div>

            <!-- 2 -->
            <div class="review-item no-photo">
                <div class="review-info">
                    <h3>사진 없는 리뷰</h3>
                    <div class="meta">⭐ 5.0 / 작성자 사용자1 / 조회수 12</div>
                    <p class="content-preview">
                        사진 없이 텍스트로만 작성한 리뷰입니다.
                    </p>
                </div>
            </div>
            
		    <!-- 페이징 -->
			<div class="pagination">
			    <a href="#">&laquo;</a>
			    <a href="#" class="active">1</a>
			    <a href="#">2</a>
			    <a href="#">3</a>
			    <a href="#">4</a>
			    <a href="#">5</a>
			    <a href="#">&raquo;</a>
			</div>

        </div>
    </div>

    <!-- 사이드바 -->
    <div class="side">

        <div class="section">
            <h2>최근 본 리뷰</h2>
            <div class="list-item">👁 최근 본 리뷰 1</div>
            <div class="list-item">👁 최근 본 리뷰 2</div>
        </div>

        <div class="section">
            <h2>주간 인기 리뷰</h2>
            <div class="list-item">📈 주간 인기 리뷰 1</div>
            <div class="list-item">📈 주간 인기 리뷰 2</div>
            <div class="list-item">📈 주간 인기 리뷰 3</div>
        </div>

        <div class="section">
            <h2>추천 리뷰</h2>
            <div class="list-item">⭐ 추천 리뷰 1</div>
            <div class="list-item">⭐ 추천 리뷰 2</div>
        </div>

    </div>
    

</div>

</body>
</html>
