<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>YamiPick</title>

<style>

	.section { box-sizing: border-box; }
	.container { width: 1200px; margin: 0 auto; display: flex; gap: 20px; }
	
	html {
	    overflow-y: scroll;
	}

	/* 검색창 ------------------------------- */
	.search-box {
	    display: flex;
	    gap: 10px;
	}
	
	.search-bar {
	  display: flex;
	  width: 100%;
	  gap: 10px;
	  margin-bottom: 50px;
	}
	
	.search-bar input {
	  flex: 1;                 /* 왼쪽부터 끝까지 */
	  padding: 12px;
	  font-size: 16px;
	  border: 1px solid #aaa;
	  border-radius: 6px;
	}
	
	.search-bar input:focus {
	    border: 1px solid #4A2D1A;
	    outline: none; /* 기본 파란 테두리 제거 */
	}
	
	.search-bar .search-btn {
	  padding: 12px 26px;
	  background: #4A2D1A;
	  color: #fff;
	  border: none;
	  border-radius: 6px;
	  font-size: 16px;
	  cursor: pointer;
	  white-space: nowrap;
	}
	
	.search-btn {
	    padding: 10px 24px;
	    background: #4A2D1A;
	    color: white;
	    border: none;
	    border-radius: 6px;
	    cursor: pointer;
	    font-size: 16px;
	    white-space: nowrap;
	}

	/* 공통 레이아웃 ------------------------ */
	.container { width: 1200px; margin: 0 auto; display: flex; gap: 20px; }
	.main { width: 75%; }
	.side { width: 25%; }

	.section { margin-bottom: 40px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
	.section h2 { margin-top: 0; margin-bottom: 15px; font-size: 20px; }

	/* 사이드 리스트 ------------------------ */
	.list-item {
		padding: 10px 0;
		border-bottom: 1px solid #ddd;
	}

	/* 정렬 메뉴 ------------------------ */
	.sort-menu {
	    display: flex;
	    align-items: center;
	    gap: 15px;
	    padding: 12px 16px;   /* 높이 ↓ */
    	margin-bottom: 20px;  /* 아래 공백 ↓ */
	}
	
	/* 정렬 기준 select */
	.sort-menu .sort-select {
	    padding: 6px 10px;
	    border: 1px solid #ccc;
	    background: #fff;
	    border-radius: 6px;
	    cursor: pointer;
	    font-size: 14px;
	}
	
	/* 사진 리뷰 체크박스 */
	.sort-menu .photo-filter {
	    display: flex;
	    align-items: center;
	    gap: 6px;
	    font-size: 14px;
	    cursor: pointer;
	}
	
	.sort-menu .photo-filter input {
	    cursor: pointer;
	}
	
	.sort-menu form {
	    display: flex;
	    align-items: center;
	    gap: 15px;
	}


	/* 리뷰 리스트 --------------------------- */
	.review-item {
		display: flex;
		gap: 15px;
		padding: 15px 0;
		border-bottom: 1px solid #ddd;
	}

	.thumb {
		width: 120px;
		height: 90px;
		background: #ccc;
		border-radius: 6px;
		flex-shrink: 0;
	}

	.review-item.no-photo {
	    padding-left: 0;
	}
	
	.review-item.no-photo .thumb {
	    display: none;
	}
	
	.thumb.no-img {
	    background: #eee;
	    display: flex;
	    align-items: center;
	    justify-content: center;
	    color: #777;
	    font-size: 13px;
	}

	.review-info h3 {
		margin: 0 0 6px 0;
		font-size: 18px;
	}

	.meta {
		font-size: 14px;
		color: #666;
		margin-bottom: 6px;
	}

	.content-preview {
		font-size: 14px;
		color: #333;
		line-height: 1.4;
	}
	
	/* 페이징 ------------------------ */
	.pagination {
	    display: flex;
	    justify-content: center;
	    gap: 8px;
	    margin-top: 25px;
	}
	
	.pagination a {
	    padding: 8px 12px;
	    border: 0px;
	    border-radius: 6px;
	    font-size: 14px;
	    text-decoration: none;
	    color: #333;
	}
	
	.pagination a.active {
	    background: #4A2D1A;
	    color: white;
	}
	
	.pagination a:hover {
	    background: #eee;
	}
	
	.section.activity {
	    background: #FAF4E8;        /* 크림 베이지 */
	    border: 1px solid #4A2D1A;  /* 초코 브라운 */
	}
	.section.activity h2 {
	    color: #4A2D1A;
	    font-weight: 700;
	}
	.list-item.activity-item {
	    font-weight: 500;
	}
	
	.count {
	    float: right;
	    color: #555;
	}
	
	.activity-header {
	    display: flex;
	    justify-content: space-between;
	    align-items: center;
	    margin-bottom: 10px;
	}

	.activity-write-btn {
	    padding: 7.5px 10.5px;
	    border-radius: 6px;
	    border: none;
	    background: #4A2D1A;
	    color: #fff;
	    font-size: 14px;
	    cursor: pointer;
	    margin-top: -14px;
	}
	
	.activity-item {
	    display: block;
	    color: inherit;
	    text-decoration: none;
	}
		
	
	.popular-tabs {
	    display: flex;
	    gap: 10px;
	    margin-bottom: 15px;
	}
		
		
	/* 일간/주간 탭 버튼 */
	.tab-btn {
	    padding: 6px 12px;
	    border: 1px solid #4A2D1A;
	    background: #F4E9D3;
	    border-radius: 6px;
	    cursor: pointer;
	    font-size: 14px;
	}
	.tab-btn.active {
	    background: #4A2D1A;
	    color: white;
	    border-color: #4A2D1A;
	}
		
	a {
	  text-decoration: none;   /* 밑줄 제거 */
	  color: inherit;          /* 부모 색상 그대로 */
	}
	
	a:visited {
	  color: inherit;
	}
	
	a:hover {
	  text-decoration: none;
	}

</style>
</head>
<body>

	<!-- 검색창 -->
	<div class="container" style="margin-top:40px;">
	    <form th:action="@{/review/reviewlist}" method="get" class="search-bar">
	        <input type="text"
	               name="keyword"
	               placeholder="리뷰 검색(가게명 / 키워드)"
	               required>
	        <button type="submit" class="search-btn">검색</button>
	    </form>
	</div>

	<!-- 메인 + 사이드 -->
	<div class="container">

    	<!-- 메인 컨텐츠 -->
    	<div class="main">

        <!-- 정렬 메뉴 -->
		<div class="section sort-menu">
		    <form th:action="@{/review/reviewlist}" method="get">
		
		        <!-- 기존 검색어 유지 -->
		        <input type="hidden" name="keyword" th:value="${keyword}">
		        <input type="hidden" name="page" th:value="${page}">
		
		        <!-- 정렬 기준 -->
		        <select class="sort-select"
		                name="sort"
		                onchange="this.form.submit()">
		            <option value="latest" th:selected="${sort == 'latest'}">최신순</option>
		            <option value="views" th:selected="${sort == 'views'}">조회수순</option>
		            <option value="favoritest" th:selected="${sort == 'favoritest'}">좋아요순</option>
		        </select>
				
		        <!-- 사진 리뷰만 (아직 로직 안 붙이면 그냥 유지) -->
		        <label class="photo-filter">
		            <input type="checkbox" name="photo"
		                   th:checked="${photo}">
		            사진 리뷰만
		        </label>
		
		    </form>
		</div>


        <!-- 검색 결과 리스트 -->
        <div class="section">
        
            <div class="review-item"
			     th:each="r : ${list}"
			     th:classappend="${r.attach == null || r.attach == ''} ? ' no-photo' : ''">
			
			    <!-- 사진 있을 때 -->
			    <div class="thumb"
			         th:if="${r.attach != null && r.attach != ''}">
			        <img th:src="${r.attach}"
			             style="width:100%; height:100%; object-fit:cover;">
			    </div>
			
			    <!-- 사진 없을 때 -->
			    <div class="thumb no-img"
			         th:if="${r.attach == null || r.attach == ''}">
			        이미지 없음
			    </div>
			
			    <div class="review-info">
			        <h3>
			            <a th:href="@{/review/reviewview(seqReview=${r.seqReview})}"
			               th:text="${r.title}">제목</a>
			        </h3>
			
			        <div class="meta">
			            <span th:text="${r.starRating}">0</span>
			            <span th:text="${r.nickname}">닉네임</span>
			            |
			            조회수 <span th:text="${r.readCount}">0</span>
			            |
					    <span th:text="${r.displayDate}"></span>
			        </div>
			
			        <p class="content-preview"
			           th:text="${#strings.abbreviate(r.reviewContent, 80)}">
			            미리보기
			        </p>
			    </div>
			</div>
            
		    <!-- 페이징 -->
			<div class="pagination">
			    <a href="#">&laquo;</a>
			    <a href="#" class="active">1</a>
			    <a href="#">2</a>
			    <a href="#">3</a>
			    <a href="#">4</a>
			    <a href="#">5</a>
			    <a href="#">&raquo;</a>
			</div>

        </div>
    </div>

    <!-- 사이드바 -->
	<div class="side">
	    
	    <!-- 내 활동 요약 -->
		<div class="section activity">
			<div class="activity-header">
				<h2>내 활동</h2>
			    <button type="button" class="activity-write-btn"
			    	onclick="location.href='/review/reviewadd'">리뷰 쓰기</button>
			</div>
			
			<a href="/review/activity?tab=review" class="list-item activity-item">
			    📝 내가 쓴 리뷰 <span class="count" th:text="${activity != null ? activity['review'] : 0} + '개'">0개</span>
			</a>
			
			<a href="/review/activity?tab=comment" class="list-item activity-item">
			    💬 내가 쓴 댓글 <span class="count" th:text="${activity != null ? activity['comment'] : 0} + '개'">0개</span>
			</a>
			
			<a href="/review/activity?tab=favorite" class="list-item activity-item">
			    ❤️ 좋아요한 리뷰 <span class="count" th:text="${activity != null ? activity['favorite'] : 0} + '개'">0개</span>
			</a>
			
			<a href="/review/activity?tab=scrap" class="list-item activity-item">
			    📌 즐겨찾기한 리뷰 <span class="count" th:text="${activity != null ? activity['scrap'] : 0} + '개'">0개</span>
			</a>
		</div>
	
	    <!-- 최근 본 리뷰 -->
	    <div class="section">
            <h2>최근 본 리뷰</h2>
            <div class="list-item">👁 최근 본 리뷰 1</div>
            <div class="list-item">👁 최근 본 리뷰 2</div>
        </div>

        <!-- 인기 리뷰 (일간/주간 탭) -->
		<div class="section">
		
		    <!-- 탭 버튼 -->
		    <div class="popular-tabs">
		        <button class="tab-btn active" onclick="showPopular('daily', event)">일간</button>
		        <button class="tab-btn" onclick="showPopular('weekly', event)">주간</button>
		    </div>
		
		    <!-- 일간 인기 리뷰 -->
		    <div id="popular-daily" class="popular-list">
				<div class="list-item"
				     th:each="r : ${popularDaily}">
				    🔥
				    <a th:href="@{/review/reviewview(seqReview=${r.seqReview})}"
				       th:text="${r.title}">제목</a>
				</div>
			</div>
		
		    <!-- 주간 인기 리뷰 -->
		    <div id="popular-weekly" class="popular-list" style="display:none;">
				<div class="list-item"
				     th:each="r : ${popularWeekly}">
				    📈
				    <a th:href="@{/review/reviewview(seqReview=${r.seqReview})}"
				       th:text="${r.title}">제목</a>
				</div>
			</div>
		</div>
	</div>

    

</div>

</body>

<script>

	function showPopular(type) {
	    document.getElementById("popular-daily").style.display = (type === 'daily') ? 'block' : 'none';
	    document.getElementById("popular-weekly").style.display = (type === 'weekly') ? 'block' : 'none';
	
	    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
	    event.target.classList.add('active');
	}
	
</script>

</html>
