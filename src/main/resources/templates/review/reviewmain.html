<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>YamiPick</title>
<style>
	.search-box {
	    display: flex;
	    gap: 10px;
	}
	
	.search-box input {
	    flex: 1;               /* 가로 꽉 채우기 */
	    padding: 10px;
	    font-size: 16px;
	    border: 1px solid #aaa;
	    border-radius: 6px;
	}
	
	.search-btn {
	    padding: 10px 24px;     /* 가로 여유 */
	    background: #4CAF50;
	    color: white;
	    border: none;
	    border-radius: 6px;
	    cursor: pointer;
	    font-size: 16px;
	    white-space: nowrap;    /* 줄바꿈 금지 → "검색" 한 줄 */
	}	

	.container { width: 1200px; margin: 0 auto; display: flex; gap: 20px; }
	.main { width: 75%; }
	.side { width: 25%; }

	.section { margin-bottom: 40px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
	.section h2 { margin-bottom: 15px; font-size: 20px; }

	/* 사진 리뷰 갤러리 */
	.gallery { 
		display: grid; 
		grid-template-columns: repeat(3, 1fr); 
		gap: 10px; 
	}
	.gallery div {
		background: #eee;
		height: 120px;
	}

	/* 리스트 형태 */
	.list-item {
		padding: 10px 0;
		border-bottom: 1px solid #ddd;
	}

	.search-box input {
		width: 100%;
		padding: 10px;
		font-size: 16px;
		border: 1px solid #aaa;
		border-radius: 6px;
	}
</style>
</head>
<body>
	<!-- reviewmain.html -->
	<!--
	1. 검색창
	
	(메인)
	2. 인기 게시글
	3. 사진 리뷰 갤러리(그리드)
	4. 사용자 위치 근처 맛집 리뷰

	(사이드)
	5. 최근 본 리뷰 (쿠키 기반)
	6. 주간 인기 리뷰
	7. 추천 리뷰(선호 태그)
	-->
	
	<!-- 검색창 -->
	<div class="container">
	    <div class="section" style="width: 100%; margin-top: 40px;">
	        <div class="search-box">
	            <input type="text" placeholder="리뷰 검색(가게명 / 키워드)">
	            <button class="search-btn">검색</button>
	        </div>
	    </div>
	</div>

    <div class="container">

        <!-- 메인 컨텐츠 -->
        <div class="main">

            <!-- 인기 게시글 -->
            <div class="section">
                <h2>인기 게시글</h2>

                <div class="list-item">🔥 인기 게시글 1</div>
                <div class="list-item">🔥 인기 게시글 2</div>
                <div class="list-item">🔥 인기 게시글 3</div>
            </div>

            <!-- 사진 리뷰 갤러리 -->
            <div class="section">
                <h2>사진 리뷰 갤러리</h2>

                <div class="gallery">
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>

            <!-- 사용자 위치 근처 맛집 리뷰 -->
            <div class="section">
                <h2>사용자 위치 근처 맛집 리뷰</h2>

                <div class="list-item">📍 근처 리뷰 1</div>
                <div class="list-item">📍 근처 리뷰 2</div>
                <div class="list-item">📍 근처 리뷰 3</div>
            </div>

        </div>

        <!-- 사이드바 -->
        <div class="side">

            <!-- 최근 본 리뷰 -->
            <div class="section">
                <h2>최근 본 리뷰</h2>
                <div class="list-item">👁 최근 본 리뷰 1</div>
                <div class="list-item">👁 최근 본 리뷰 2</div>
            </div>

            <!-- 주간 인기 리뷰 -->
            <div class="section">
                <h2>주간 인기 리뷰</h2>
                <div class="list-item">📈 주간 인기 리뷰 1</div>
                <div class="list-item">📈 주간 인기 리뷰 2</div>
                <div class="list-item">📈 주간 인기 리뷰 3</div>
            </div>

            <!-- 추천 리뷰 (선호 태그 기반) -->
            <div class="section">
                <h2>추천 리뷰</h2>
                <div class="list-item">⭐ 추천 리뷰 1</div>
                <div class="list-item">⭐ 추천 리뷰 2</div>
            </div>

        </div>

    </div>
	
	
</body>
</html>
