<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>YamiPick - 리뷰 상세보기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

  <style>
    body {
      font-family: "Noto Sans KR", sans-serif;
      background-color: #FAF4E8;
      margin: 0;
      padding: 0;
      color: #4A2D1A;
    }

    .container {
      max-width: 1000px;
      margin: 50px auto 20px auto;
      margin-bottom: 2px;
      background-color: #fff;
      border: 1px solid #e3d8c8;
      border-radius: 14px;
      padding: 40px 50px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
    }

    h2 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #3A2315;
    }

    .meta {
      font-size: 14px;
      color: #7d6b5a;
      margin-bottom: 28px;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
    }

    .row {
      margin-bottom: 40px;
    }
    
    .row.tag-row {
	    margin-bottom: 0 !important;
	}

    .label-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #3A2315;
    }

    .text-box {
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-line;
      color: #4A2D1A;
    }

    /* 이미지 리스트 */
    .image-list {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      width: 80%;
    }

	.image-list img {
	  width: 100%;      /* 가로 전체 */
	  height: auto;     /* 세로 비율 자동 */
	  border-radius: 12px;
	  border: 1px solid #ddd;
	  display: block;   /* 여백/틈 제거 */
	}


    /* 태그 */
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      background-color: #F4E9D3;
      border: 1px solid #C8B79E;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 14px;
      color: #4A2D1A;
      font-weight: 500;
    }
    
    .tag-section {
	  margin-top: 40px;
	} 

    /* 지도 */
    #map {
      width: 100%;
      height: 300px;
      border-radius: 10px;
      background: #eee;
      border: 1px solid #d4c7b7;
    }

	.material-symbols-outlined {
	  font-variation-settings:
	  'FILL' 0,
	  'wght' 400,
	  'GRAD' 0,
	  'opsz' 24
	}
	
	.icon-divider {
	    text-align: right;
	    margin: 0px 550px 5px 0;
	    font-size: 32px;
	}
    
	/* 댓글 컨테이너 */
	.comment-container {
	  max-width: 1000px;
	  margin: 20px auto 20px auto;
	  padding: 20px 50px;
	  background: #fff;
	  border: 1px solid #e3d8c8;
	  border-radius: 12px;
	  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
	}
	
	/* 댓글 항목 */
	.comment-item {
	  padding: 18px 0;
	  border-bottom: 1px solid #f0e8dd;
	}
	
	.comment-item:first-child {
	    border-top: none;
	}
	
	.comment-item:first-child {
	    border-top: none;
	}
	
	.comment-meta {
	  display: flex;
	  justify-content: space-between;
	  font-size: 14px;
	  color: #7d6b5a;
	  margin-bottom: 6px;
	  font-weight: 500;
	}
	
	.comment-content {
	  font-size: 15px;
	  color: #4A2D1A;
	  line-height: 1.6;
	  white-space: pre-line;
	}
	
	.comment-item.last {
	  border-bottom: none !important;
	}
	
	/* 댓글 작성 폼 */
	.comment-write-box-inside {
	    margin-top: 20px;
	    padding-top: 20px;
	}
	
	.comment-input {
	  width: 100%;
	  height: 120px;
	  padding: 14px;
	  font-size: 15px;
	  border: 1px solid #cfc7bc;
	  border-radius: 8px;
	  resize: none;
	  box-sizing: border-box;
	  margin-bottom: 14px;
	  background-color: #fdfaf6;
	  color: #4A2D1A;
	  font-family: "Noto Sans KR", sans-serif;
	}
	
	.comment-input::placeholder {
	  color: #b4a89c;
	}
	
	.comment-btn {
	  padding: 10px 20px;
	  background: #4A2D1A;
	  color: #fff;
	  border-radius: 6px;
	  border: none;
	  cursor: pointer;
	  font-size: 14px;
	  transition: background 0.2s ease;
	}
	
	.comment-btn:hover {
	  background: #3A2315;
	}
	
	.comment-btn-right {
	    width: 100%;
	    display: flex;
	    justify-content: flex-end; /* 오른쪽 정렬 */
	}
	
	
    /* 버튼 */
    .btn-box {
	  width: 100%;
	  max-width: 1060px;   /* container와 너비를 맞춤 */
	  margin: 5px auto 0 auto;   /* 가운데 정렬 */
	  display: flex;
	  justify-content: space-between;
	  align-items: center;
	  margin-bottom: 40px;
	}

    .btn {
      padding: 8.5px 17px;
      background: #4A2D1A;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: #3A2315;
    }

    .btn-gray {
      background: #a89f96;
    }

    .btn-gray:hover {
      background: #8e857c;
    }
    
  </style>
</head>

<body>

<div class="container">

  <!-- 제목 -->
  <h2 th:text="${review.title}">리뷰 제목</h2>

  <!-- 작성 정보 -->
  <div class="meta">
    작성자: <span th:text="${review.nickname}">닉네임</span> ·
    작성일: <span th:text="${review.regdate}">2025.12.08</span> ·
    조회: <span th:text="${review.readCount}">123</span>
  </div>

  <!-- 내용 -->
  <div class="row">
    <div class="text-box" th:text="${review.reviewContent}"></div>
  </div>
  
  <!-- 이미지 -->
  <div class="row" th:if="${review.attach != null and review.attach != ''}">
    <div class="image-list">
      <img th:src="${review.attach}">
    </div>
  </div>

  <!-- 주소 + 지도 -->
  <div class="row" th:if="${review.place != null and review.place != ''}">
    <div class="label-title">가게 위치</div>
    <div id="map"></div>
  </div>

	<!-- 태그 -->
	<div class="row tag-row"
		th:if="${review.tagList != null and #lists.size(review.tagList) > 0}">
		<div class="tag-list">
	        <div th:each="tag : ${review.tagList}" class="tag" th:text="'#' + ${tag}"></div>
	    </div>
	</div>
  
</div>

	<!-- 아이콘 영역 -->
	<div class="icon-divider">
	    <span class="material-symbols-outlined">favorite</span>
	    <span class="material-symbols-outlined">star</span>
	</div>
  
	<!-- 댓글 영역 전체 -->
	<div class="comment-container">
	
	    <!-- 댓글 목록 -->
	    <div class="comment-item"
	         th:each="c, stat : ${comments}"
	         th:classappend="${stat.last} ? ' last'">
	
	        <div class="comment-meta">
	            <span class="nickname" th:text="${c.nickname}">닉네임</span>
	            <span class="date" th:text="${c.regdate}">2025-12-08</span>
	        </div>
	
	        <div class="comment-content" th:text="${c.content}"></div>
	    </div>
	
	    <!-- 댓글 작성 폼 (컨테이너 내부로 이동) -->
	    <div class="comment-write-box-inside">
	        <form th:action="@{/review/comment/add}" method="post">
	            <input type="hidden" name="seqReview" th:value="${review.seqReview}">
	            <textarea name="content" class="comment-input"
	                      placeholder="댓글을 입력하세요" required></textarea>
	            <div class="comment-btn-right">
				    <button type="submit" class="comment-btn">댓글 작성</button>
				</div>
	        </form>
	    </div>
	
	</div>

	<!-- 버튼 -->
	<div class="btn-box">
	    <a th:href="@{/review/list}" class="btn btn-gray">목록으로</a>
	    <div>
	    	<a th:href="@{/review/edit/{seq}(seq=${review.seqReview})}" class="btn">수정</a>
	    	<a th:href="@{/review/delete/{seq}(seq=${review.seqReview})}" class="btn btn-gray">삭제</a>
	  	</div>
	</div>

<!-- Kakao 지도 -->
<script type="text/javascript"
        th:src="@{//dapi.kakao.com/v2/maps/sdk.js(appkey=${kakaoAppKey})}">
</script>

<script th:inline="javascript">
  var lat = /*[[${lat}]]*/ 0;
  var lng = /*[[${lng}]]*/ 0;

  var container = document.getElementById('map');
  var mapOption = {
    center: new kakao.maps.LatLng(lat, lng),
    level: 3
  };

  var map = new kakao.maps.Map(container, mapOption);

  var marker = new kakao.maps.Marker({
    position: new kakao.maps.LatLng(lat, lng),
    image: new kakao.maps.MarkerImage(
      '/img/marker-brown.png',
      new kakao.maps.Size(45, 45),
      { offset: new kakao.maps.Point(19.4, 35) }
    )
  });

  marker.setMap(map);
  
  	// 마커 클릭 시 카카오맵으로 이동
	kakao.maps.event.addListener(marker, 'click', function() {
	    var url = "https://map.kakao.com/link/map/" 
	              + encodeURIComponent("가게위치") + "," + lat + "," + lng;
	    window.open(url, "_blank");
	});
  
	kakao.maps.event.addListener(map, 'click', function() {
	    var url = "https://map.kakao.com/link/map/" 
	              + encodeURIComponent("가게위치") + "," + lat + "," + lng;
	    window.open(url, "_blank");
	});
  
  
</script>

</body>
</html>
