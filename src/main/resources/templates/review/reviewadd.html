<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>YamiPick - 리뷰 작성</title>
    <style>
        body {
            font-family: "Noto Sans KR", sans-serif;
            background: #FAF4E8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 1000px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            padding: 30px 40px;
            border: 1px solid #e3d8c8;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
            color: #4A2D1A;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4A2D1A;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 20px;
        }

        textarea {
            height: 200px;
            resize: none;
        }

        .row {
            margin-bottom: 25px;
        }

        .filebox {
            margin-bottom: 20px;
        }

        .filebox input[type="file"] {
            margin-top: 5px;
        }

        /* 태그 입력 */
        .tag-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tag-input input {
            flex: 1;
        }

        #tagList {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background: #F4E9D3;
            border: 1px solid #C8B79E;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            color: #4A2D1A;
        }

        /* 비밀글 */
        .secret-box {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .write-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #4A2D1A;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 30px;
        }

        .write-btn:hover {
            background: #3A2315;
        }

        /* 지도 영역 */
        #map {
            width: 100%;
            height: 250px;
            background: #eee;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .map-notice {
            font-size: 13px;
            color: #7a6a58;
            margin-bottom: 10px;
        }

    </style>
</head>
<body>

<div class="container">
    <h2>리뷰 작성</h2>

    <form th:action="@{/review/addok}" method="post" enctype="multipart/form-data">

        <!-- 제목 -->
        <div class="row">
            <label>제목</label>
            <input type="text" name="title" placeholder="리뷰 제목을 입력하세요" required>
        </div>
        
        <!-- 가게 선택 (필수 X) -->
        <div class="row">
            <label>가게 선택 (선택)</label>
            <select name="seqStore">
                <option value="">선택 안 함</option>
                <option th:each="s : ${storeList}" th:value="${s.seqStore}" th:text="${s.storeName}"></option>
            </select>
        </div>

        <!-- 첨부파일 -->
        <div class="filebox">
            <label>첨부 이미지</label>
            <input type="file" name="attach" accept="image/*" multiple>
        </div>

        <!-- 내용 -->
        <div class="row">
            <label>내용</label>
            <textarea name="review" placeholder="리뷰 내용을 입력하세요" required></textarea>
        </div>

        <!-- 카카오 지도 -->
        <div class="row">
            <label>위치 선택</label>
            <div class="map-notice">지도를 클릭하면 위치가 자동으로 저장됩니다.</div>
            <div id="map"></div>
            <input type="text" name="place" id="placeInput" placeholder="선택한 위치 주소" readonly>
        </div>

        <!-- 태그 -->
        <div class="row">
            <label>태그</label>
            <div class="tag-input">
                <input type="text" id="tagText" placeholder="#태그 입력">
                <button type="button" onclick="addTag()">추가</button>
            </div>
            <div id="tagList"></div>
            <input type="hidden" name="tags" id="tagsHidden">
        </div>

        <!-- 비밀글 -->
        <div class="secret-box">
            <input type="checkbox" name="contentState" value="비밀글">
            <label>비밀글</label>
        </div>

        <!-- 제출 버튼 -->
        <button type="submit" class="write-btn">등록하기</button>
    </form>
</div>


<!-- Kakao Map -->
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_APP_KEY&libraries=services"></script>
<script>
    // 기본 지도
    var mapContainer = document.getElementById('map');
    var mapOption = {
        center: new kakao.maps.LatLng(37.566826, 126.9786567),
        level: 3
    };

    var map = new kakao.maps.Map(mapContainer, mapOption);
    var geocoder = new kakao.maps.services.Geocoder();
    var marker = new kakao.maps.Marker();

    kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
        var latlng = mouseEvent.latLng;

        marker.setMap(map);
        marker.setPosition(latlng);

        geocoder.coord2Address(latlng.getLat(), latlng.getLng(), function(result, status) {
            if (status === kakao.maps.services.Status.OK) {
                var addr = result[0].address.address_name;
                document.getElementById('placeInput').value = addr;
            }
        });
    });
</script>

<!-- 태그 스크립트 -->
<script>
    let tagArr = [];

    function addTag() {
        const tagText = document.getElementById("tagText").value.trim();
        if (tagText === "") return;

        tagArr.push(tagText);
        document.getElementById("tagText").value = "";

        renderTags();
    }

    function renderTags() {
        const tagArea = document.getElementById("tagList");
        tagArea.innerHTML = "";

        tagArr.forEach(t => {
            let tag = document.createElement("div");
            tag.classList.add("tag");
            tag.innerText = "#" + t;
            tagArea.appendChild(tag);
        });

        document.getElementById("tagsHidden").value = tagArr.join(",");
    }
</script>

</body>
</html>
