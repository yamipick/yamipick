<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>예약하기</title>
    <link rel="stylesheet" href="http://bit.ly/3WJ5ilK" />
    
    <!-- 🔹 flatpickr CSS/JS 추가 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
</head>
<body>

    <h1>예약하기</h1>

    <!-- ★ action: formok -> tableSelect 로 변경 -->
    <form id="reservationForm" th:action="@{/reservation/tableSelect}" method="post"
          th:object="${reservation}">

        <!-- 숨겨진 값들: 유저, 매장 -->
        <input type="hidden" th:field="*{seqUser}">
        <input type="hidden" th:field="*{seqStore}">

        <!-- 매장 표시 -->
        <div>
            <label>매장:</label>
            <span th:text="${store.name}">매장 이름</span>
        </div>

        <!-- 예약 날짜 -->
		<div>
		    <label>예약 날짜:</label>
		
		    <!-- 실제로 서버와 바인딩되는 필드 (숨김) -->
		    <input type="hidden"
		           id="reserveDate"
		           th:field="*{reserveDate}"
		           required>
		
		    <!-- 화면에 항상 떠 있을 캘린더 -->
		    <div id="reserveDateCalendar"></div>
		</div>

		<!-- 인원 수 -->
        <div>
            <label>인원 수:</label>
            <input type="number" id="peopleCount" th:field="*{peopleCount}" min="1">
        </div>

        <!-- 예약 시간 (1시간 단위) -->
        <div>
		    <label>예약 시간:</label> 
		    <select th:field="*{reserveTime}" id="reserveTime" >
		        <option value="">날짜와 인원을 선택해주세요</option>
		        <!-- 옵션은 JS가 채움 -->
		    </select>
		</div>

        <button type="submit" id="tableSelectBtn">테이블 타입 선택</button>
    </form>

<script th:inline="javascript">
    window.addEventListener('DOMContentLoaded', function () {

        // 🔹 DOM 요소들
        const hiddenDateInput = document.getElementById('reserveDate');      // hidden input (th:field="*{reserveDate}")
        const calendarEl      = document.getElementById('reserveDateCalendar'); // 항상 떠있는 달력 div
        const timeSelect      = document.getElementById('reserveTime');
        const peopleInput     = document.getElementById('peopleCount');
        const form            = document.getElementById('reservationForm');

        // 🔹 서버에서 내려보낸 seqStore (Thymeleaf)
        const seqStore = /*[[${reservation.seqStore}]]*/ null;

        // 🔹 휴무일 세트 (yyyy-MM-dd 문자열)
        let holidaySet = new Set();
        let fpInstance = null;

        if (!seqStore) {
            console.error('seqStore가 없습니다. (예약 폼 진입 시 매장 ID 필요)');
            return;
        }

        // ===============================
        // 1) 시간 옵션 로딩 함수
        // ===============================
        function loadTimeSlots(dateStr) {

            if (!timeSelect) return;

            const dateVal   = dateStr || hiddenDateInput.value;
            const peopleVal = peopleInput ? peopleInput.value : null;

            // 날짜 / 인원 둘 다 있어야 시간 불러옴
            if (!dateVal || !peopleVal) {
                timeSelect.innerHTML = '';
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '날짜와 인원을 선택해주세요';
                opt.selected = true;
                timeSelect.appendChild(opt);
                return;
            }

            // 선택한 날짜가 휴무일이면 막기
            if (holidaySet.has(dateVal)) {
                timeSelect.innerHTML = '';
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '휴무일에는 예약할 수 없습니다.';
                opt.disabled = true;
                opt.selected = true;
                timeSelect.appendChild(opt);
                return;
            }

            const url = `/reservation/available-times`
                + `?seqStore=${encodeURIComponent(seqStore)}`
                + `&reserveDate=${encodeURIComponent(dateVal)}`
                + `&peopleCount=${encodeURIComponent(peopleVal)}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    timeSelect.innerHTML = '';

                    if (!data || data.length === 0) {
                        const opt = document.createElement('option');
                        opt.value = '';
                        opt.textContent = '예약 가능한 시간이 없습니다. (휴무/마감)';
                        opt.disabled = true;
                        opt.selected = true;
                        timeSelect.appendChild(opt);
                        return;
                    }

                    const placeholder = document.createElement('option');
                    placeholder.value = '';
                    placeholder.textContent = '-- 시간 선택 --';
                    placeholder.disabled = true;
                    placeholder.selected = true;
                    timeSelect.appendChild(placeholder);

                    let hasAnyAvailable = false;

                    data.forEach(slot => {
                        const opt = document.createElement('option');
                        opt.value = slot.time;

                        if (slot.available) {
                            opt.textContent = slot.time;
                            hasAnyAvailable = true;
                        } else {
                            opt.textContent = slot.time + ' (예약 불가)';
                            opt.disabled = true;
                        }

                        timeSelect.appendChild(opt);
                    });

                    if (!hasAnyAvailable) {
                        alert('선택하신 날짜에는 예약 가능한 시간이 없습니다.\n(휴무일이거나 모든 시간이 만석입니다.)');
                    }
                })
                .catch(err => {
                    console.error('시간 로딩 실패', err);
                    timeSelect.innerHTML = '';
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = '시간 정보를 불러오지 못했습니다.';
                    opt.disabled = true;
                    opt.selected = true;
                    timeSelect.appendChild(opt);
                });
        }

        // ===============================
        // 2) 휴무일 로딩 + flatpickr disable 적용
        // ===============================
        function updateFlatpickrDisable() {
            if (!fpInstance) return;

            fpInstance.set('disable', [
                function(date) {
                    const yyyy = date.getFullYear();
                    const mm = String(date.getMonth() + 1).padStart(2, '0');
                    const dd = String(date.getDate()).padStart(2, '0');
                    const s = `${yyyy}-${mm}-${dd}`;

                    // true 반환하면 "선택 불가능" (휴무일)
                    return holidaySet.has(s);
                }
            ]);
        }

        function loadHolidays(year, month) {
            const url = `/reservation/holiday-dates`
                + `?seqStore=${encodeURIComponent(seqStore)}`
                + `&year=${year}`
                + `&month=${month}`;

            fetch(url)
                .then(res => res.json())
                .then(holidays => {

                    if (!Array.isArray(holidays)) {
                        console.error('휴무일 응답 형식이 이상함:', holidays);
                        return;
                    }

                    holidaySet = new Set(holidays);
                    updateFlatpickrDisable();

                    // 현재 선택된 날짜가 휴무일이 되어버린 상황이면 처리
                    const currentVal = hiddenDateInput.value;
                    if (currentVal && holidaySet.has(currentVal)) {
                        alert('선택하신 날짜가 매장 휴무일입니다. 다른 날짜를 선택해 주세요.');
                        hiddenDateInput.value = '';
                        if (timeSelect) {
                            timeSelect.innerHTML = '';
                            const opt = document.createElement('option');
                            opt.value = '';
                            opt.textContent = '날짜와 인원을 선택해주세요';
                            opt.selected = true;
                            timeSelect.appendChild(opt);
                        }
                    }
                })
                .catch(err => {
                    console.error('휴무일 로딩 실패', err);
                });
        }

        // ===============================
        // 3) flatpickr (inline) 초기화
        // ===============================
        if (calendarEl && hiddenDateInput) {

        	const today = new Date();
        	const maxDate = new Date(today);
        	maxDate.setMonth(maxDate.getMonth() + 1);   // 한 달 뒤
        	
            fpInstance = flatpickr(calendarEl, {
                inline: true,           // 🔥 항상 떠있는 달력
                locale: 'ko',
                dateFormat: 'Y-m-d',    // 백엔드 LocalDate와 동일 (yyyy-MM-dd)
                
            	minDate: 'today',
            	maxDate: maxDate, // 한 달 뒤까지만 선택 가능

                // 달력 준비되면 현재 월 휴무일 + 기본 날짜 세팅
                onReady: function(selectedDates, dateStr, instance) {
                    const today = new Date();

                    // hidden에 값이 이미 있으면 그걸 기본으로, 아니면 오늘날짜
                    let initialDateStr = hiddenDateInput.value;
                    if (!initialDateStr) {
                        const yyyy = today.getFullYear();
                        const mm = String(today.getMonth() + 1).padStart(2, '0');
                        const dd = String(today.getDate()).padStart(2, '0');
                        initialDateStr = `${yyyy}-${mm}-${dd}`;
                        hiddenDateInput.value = initialDateStr;
                    }

                    // 캘린더에도 선택 반영
                    instance.setDate(initialDateStr, true);

                    // 휴무일 로딩 + 시간 로딩
                    loadHolidays(today.getFullYear(), today.getMonth() + 1);
                    loadTimeSlots(initialDateStr);
                },

                // 월 바뀔 때마다 해당 연월 휴무일 다시 로딩
                onMonthChange: function(selectedDates, dateStr, instance) {
                    const year  = instance.currentYear;
                    const month = instance.currentMonth + 1; // 0-based → 1-based
                    loadHolidays(year, month);
                },

                // 날짜 선택 시 시간 슬롯 로딩
                onChange: function(selectedDates, dateStr, instance) {
                    if (!dateStr) return;

                    // 선택한 날짜가 휴무일이면 막기
                    if (holidaySet.has(dateStr)) {
                        alert('해당 날짜는 매장 휴무일입니다. 다른 날짜를 선택해 주세요.');
                        instance.clear();
                        hiddenDateInput.value = '';
                        if (timeSelect) {
                            timeSelect.innerHTML = '';
                            const opt = document.createElement('option');
                            opt.value = '';
                            opt.textContent = '날짜와 인원을 선택해주세요';
                            opt.selected = true;
                            timeSelect.appendChild(opt);
                        }
                        return;
                    }

                    // ✅ 선택된 날짜를 hidden input에 저장
                    hiddenDateInput.value = dateStr;

                    // ✅ 시간 목록 갱신
                    loadTimeSlots(dateStr);
                }
            });
        }

        // ===============================
        // 4) 인원 변경 시 시간 다시 계산
        // ===============================
        if (peopleInput) {
            peopleInput.addEventListener('input', function () {
                const dateVal = hiddenDateInput.value;
                if (dateVal) {
                    loadTimeSlots(dateVal);
                }
            });
        }

        // ===============================
        // 5) 폼 submit 검증
        // ===============================
        if (form) {
            form.addEventListener('submit', function (e) {
                const dateVal   = hiddenDateInput.value;
                const peopleVal = peopleInput ? peopleInput.value : null;
                const timeVal   = timeSelect ? timeSelect.value : null;

                if (!dateVal) {
                    alert('예약 날짜를 선택해 주세요.');
                    e.preventDefault();
                    return;
                }
                if (holidaySet.has(dateVal)) {
                    alert('휴무일에는 예약할 수 없습니다.');
                    e.preventDefault();
                    return;
                }
                if (!timeVal) {
                    alert('예약 시간을 선택해 주세요.');
                    e.preventDefault();
                    return;
                }
                if (!peopleVal || Number(peopleVal) <= 0) {
                    alert('인원 수를 입력해 주세요.');
                    e.preventDefault();
                    return;
                }
            });
        }
        
     // ===============================
     // 6) 인원수 최대 제한 (예: 20명)
     // ===============================
     const MAX_PEOPLE = 20;
     const tableSelectBtn = document.getElementById('tableSelectBtn');

     function checkPeopleLimit() {
         const p = Number(peopleInput.value);

         if (p >= MAX_PEOPLE) {
             // 버튼 비활성화
             tableSelectBtn.disabled = true;
             // 문구 변경
             tableSelectBtn.textContent = `${MAX_PEOPLE}명 이상의 예약은 매장으로 문의 바랍니다.`;
         } else {
             // 다시 활성화
             tableSelectBtn.disabled = false;
             // 기존 문구 복구
             tableSelectBtn.textContent = "테이블 타입 선택";
         }
     }

     // 인원 입력 시마다 검사 실행
     if (peopleInput) {
         peopleInput.addEventListener('input', checkPeopleLimit);
     }

     // 페이지 로드시 초기 검사(수정 화면 대비)
     checkPeopleLimit();

    });
</script>

</body>
</html>
