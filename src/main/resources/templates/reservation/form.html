<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>예약하기</title>
	<link rel="stylesheet" href="http://bit.ly/3WJ5ilK" />
</head>
<body>

	<h1>예약하기</h1>

	<form th:action="@{/reservation/formok}" method="post" th:object="${reservation}">
	
	    <!-- 숨겨진 값들: 유저, 매장, 테이블타입 (지금은 하드코딩이라 숨김 처리) -->
	    <input type="hidden" th:field="*{seqUser}">
	    <input type="hidden" th:field="*{seqStore}">
	    <input type="hidden" th:field="*{seqStoreTable}">
	
	    <div>
	        <label>예약 날짜:</label>
	        <input type="date" id="reserveDate" name="reserveDate" th:field="*{reserveDate}">
	    </div>
	
	    <div>
	        <label>예약 시간:</label>
	        <input type="time" th:field="*{reserveTime}">
	    </div>
	
	    <div>
	        <label>인원 수:</label>
	        <input type="number" th:field="*{peopleCount}" min="1">
	    </div>
	
	    <button type="submit">예약하기</button>
	</form>
	
	<script th:inline="javascript">
	    window.addEventListener('DOMContentLoaded', function () {
	        const dateInput = document.getElementById('reserveDate');
	        if (!dateInput) return;
	
	        const today = new Date();
	        const yyyy = today.getFullYear();
	        const mm = String(today.getMonth() + 1).padStart(2, '0');
	        const dd = String(today.getDate()).padStart(2, '0');
	
	        const todayStr = `${yyyy}-${mm}-${dd}`;
	
	        // 오늘 이전 날짜 선택 못하게
	        dateInput.setAttribute('min', todayStr);
	
	        // 혹시 기본값이 과거면 오늘로 덮어쓰기
	        if (dateInput.value && dateInput.value < todayStr) {
	            dateInput.value = todayStr;
	        }
	    });
	</script>
	
</body>
</html>
