<style>
    /* ... (Warm Choco & Cream Theme Variables - 통일) ... */

    /* -------------------------------------------------------
       Global Layout & Typography
    ------------------------------------------------------- */
    body { 
        font-family: 'Pretendard', 'Malgun Gothic', sans-serif; 
        background-color: var(--cream-light); 
        color: var(--choco-dark); 
        padding-top: 60px;
        margin: 0;
    }
    
    .wrap-container { 
        max-width: 500px; 
        margin: 40px auto; 
        padding: 30px; 
        background: var(--cream-card); 
        border-radius: var(--radius-l); 
        box-shadow: var(--shadow); 
    }
    
    h1 { 
        color: var(--choco-dark); 
        border-bottom: 3px solid var(--choco-accent); /* H1 스타일 통일 */
        padding-bottom: 10px; 
        margin-bottom: 25px; 
        font-weight: 900; 
        font-size: 26px;
        text-align: center;
    }
    
    a { text-decoration: none; color: var(--choco-main); transition: color .15s ease; }
    a:hover { color: var(--choco-dark); text-decoration: underline; }

    /* -------------------------------------------------------
       Form & Input Style (Theme Colors 적용)
    ------------------------------------------------------- */
    div {
        margin-bottom: 15px;
    }
    label {
        font-weight: 600;
        display: block;
        margin-bottom: 5px;
        color: var(--choco-dark);
    }
    input[type="text"], input[type="email"], input[type="password"], select {
        padding: 10px 12px; 
        border: 1px solid var(--border-light);
        border-radius: 4px;
        background-color: var(--cream-dark); /* 입력 필드 배경색 */
        color: var(--choco-dark);
        font-size: 16px;
        width: 100%;
        box-sizing: border-box;
    }
    select {
        appearance: none; 
        padding-right: 30px; 
        /* select 화살표 색상도 초코색으로 변경 */
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%236D4C41%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13.2-5.4H18.6c-5%200-9.7%202-13.2%205.4a17.6%2017.6%200%200%0a-5.4%2013.2%205.4%2017.6%200%200%200%2013.2%205.4h255.2c5%200%209.7-2%2013.2-5.4a17.6%2017.6%200%200%200%205.4-13.2z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 10px;
    }

    /* -------------------------------------------------------
       Button Style
    ------------------------------------------------------- */
    button[type="submit"] {
        padding: 12px 20px; 
        border-radius: var(--radius-s);
        cursor: pointer;
        font-weight: 700;
        transition: all .15s ease;
        display: block;
        width: 100%;
        line-height: 1.2;
        font-size: 18px;
        border: none;
        margin-top: 30px;
    }
    
    /* 회원가입 버튼 (Primary Color) */
    button[type="submit"] { 
        background: var(--choco-accent);
        color: var(--cream-card);
    }
    button[type="submit"]:hover {
        background: var(--choco-main);
    }
    
    .login-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
    }
</style>
<body>
    <div th:replace="~{common/header :: headerFragment}"></div>

<div class="wrap-container">
	<h1>회원가입</h1>
	
	<form th:action="@{/joinok}" th:object="${user}" method="post">
    <div>
	        <label>아이디</label>
	        <input type="text" th:field="*{id}" required/>
	    </div>
	
	    <div>
	        <label>이름</label>
	        <input type="text" th:field="*{name}" required/>
	    </div>
	
	    <div>
	        <label>비밀번호</label>
	        <input type="password" th:field="*{password}" required/>
	    </div>
	
	    <div>
	        <label>이메일</label>
	        <input type="email" th:field="*{email}" required/>
	    </div>
	
	    <div>
	        <label>전화번호</label>
	        <input type="text" th:field="*{phone}" required/>
	    </div>
	
	    <div>
	        <label>닉네임</label>
	        <input type="text" th:field="*{nickname}" required/>
	    </div>
	
	    <div>
	        <label>역할</label>
	        <select th:field="*{role}">
	            <option value="CUSTOMER">회원</option>
	            <option value="STORE">매장</option>
	            <option value="ADMIN">관리자</option>
	        </select>
	    </div>
	
	    <button type="submit">회원가입</button>
	</form>
	
	<a th:href="@{/login}" class="login-link">로그인 페이지로</a>
</div>
</body>
</html>
