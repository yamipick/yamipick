<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>매장 선택하기</title>
	<link rel="stylesheet" href="http://bit.ly/3WJ5ilK" />
</head>
<body>

<h1>예약할 매장을 선택하세요</h1>

<!-- 검색 폼 -->
<form th:action="@{/reservation/storeSelect}" method="get">
    <input type="text" name="keyword" placeholder="매장 이름 검색"
           th:value="${keyword}">
    <button type="submit">검색</button>
</form>

<hr>

<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>매장명</th>
        <th>주소</th>
        <th>예약</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(stores)}">
        <td colspan="3">등록된 매장이 없습니다.</td>
    </tr>
    <tr th:each="s : ${stores}">
        <td th:text="${s.name}">매장이름</td>
        <td th:text="${s.address}">주소</td>
        <td>
            <a th:href="@{|/reservation/form?seqStore=${s.seqStore}|}">
                예약하기
            </a>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/reservation/main}">← 예약 메인으로</a>

</body>
</html>
