<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>테이블 타입 선택</title>
  <link rel="stylesheet" href="http://bit.ly/3WJ5ilK" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />

<style>
    /* 폰트, 기본 레이아웃은 유지 */
    .wrap { max-width: 720px; margin: 30px auto; padding: 0 12px; }
    .card { border: 1px solid #eee; border-radius: 18px; padding: 18px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    h3 { margin: 0 0 16px; font-weight: 900; } 

    /* 그리드 */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; } 
    @media (max-width: 520px){ .grid{ grid-template-columns: repeat(2, 1fr);} }

    /* radio 숨기기 */
    .type-radio { position: absolute; opacity: 0; pointer-events: none; }

    /* ✅ 카드 버튼 스타일 */
    .type-item {
      border: 1px solid #eee; 
      border-radius: 12px; 
      padding: 24px 12px 18px; 
      cursor: pointer;
      text-align: center;
      user-select: none;
      transition: all .15s ease;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100px;
    }
    .type-item:hover { 
        transform: translateY(-2px); 
        box-shadow: 0 4px 12px rgba(0,0,0,.04); 
    }

    /* ✅ 선택됨 스타일 */
    .type-radio:checked + .type-item {
      border-color: #ff3b1a; 
      background: #fff; 
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 59, 26, 0.1); 
    }
    .type-radio:checked + .type-item .label { 
        color: #ff3b1a; 
        font-weight: 900; 
    }
    /* 🚨 수정: 'stroke' 대신 'color' 사용 */
    .type-radio:checked + .type-item .icon { 
        color: #ff3b1a; 
        /* stroke 속성 제거 */
    }


    /* ✅ 예약불가(만석) 카드 스타일 */
    .type-item.disabled {
      cursor: not-allowed;
      opacity: .4; 
      transform: none; 
      box-shadow: none;
      border-color: #eee;
    }
    .type-item.disabled:hover { border-color: #eee; }

    /* 🚨 아이콘 스타일 재정의 (color: #111 이 확실히 적용되도록) */
    .icon { 
      /* 크기/정렬 관련 설정 유지 */
      width: 36px; 
      height: 36px; 
      margin-bottom: 8px; 
      display: flex; 
      align-items: center;
      justify-content: center;
      
      /* ✅ 핵심: 폰트 아이콘 관련 스타일 */
      font-size: 30px; 
      font-style: normal;
      line-height: 1;
      
      /* 🔑 색상 강제 지정 (기본 검은색) */
      color: #111 !important; /* !important를 사용하여 다른 스타일 무시 방지 */
      transition: color .15s ease;
    }
    
    /* ✅ 선택된 상태: color만 변경 */
    .type-radio:checked + .type-item .icon { 
        color: #ff3b1a !important; /* !important로 선택 시 주황색 강제 적용 */
    }
    
    .label { 
        font-size: 14px; 
        font-weight: 800; 
        color: #111; 
        transition: color .15s ease;
    }
    .sub { margin-top: 6px; font-size: 12px; color: #666; }

    /* ✅ 액션 버튼 스타일 */
    .actions { display: flex; gap: 10px; margin-top: 24px; } 
    .btn {
      flex: 1;
      border-radius: 16px; 
      padding: 16px 12px; 
      border: 1px solid #ddd;
      background: #fff;
      font-weight: 800; 
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    .btn:hover { background: #f8f8f8; }

    .btn-primary {
      border: 0;
      background: #ff3b1a;
      color: #fff;
    }
    .btn-primary:hover {
        background: #e63617; 
    }
    .btn-primary:disabled {
      opacity: .45;
      cursor: not-allowed;
      background: #ff3b1a; 
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="card">

    <form th:action="@{/reservation/formok}" method="post" th:object="${reservation}">

      <!-- 1단계에서 받아온 값들 다시 넘겨주기 -->
      <input type="hidden" th:field="*{seqUser}">
      <input type="hidden" th:field="*{seqStore}">
      <input type="hidden" th:field="*{reserveDate}">
      <input type="hidden" th:field="*{reserveTime}">
      <input type="hidden" th:field="*{peopleCount}">

      <h3>테이블 타입 선택</h3>

      <!-- ✅ 기존 select 제거하고, radio 카드로 교체 -->
      <div class="grid">

        <div th:each="opt : ${tableOptions}">
          <!-- opt.available == true인 것만 선택 가능 -->
          <input class="type-radio"
                 type="radio"
                 th:field="*{seqStoreTable}"
                 th:id="'tt-' + ${opt.seqStoreTable}"
                 th:value="${opt.seqStoreTable}"
                 th:disabled="${!opt.available}" />

          <label class="type-item"
                 th:for="'tt-' + ${opt.seqStoreTable}"
                 th:classappend="${!opt.available} ? ' disabled' : ''">

            <!-- 아이콘(이름에 따라 자동) -->
            <i class="icon ri-restaurant-line"
			   th:if="${#strings.contains(opt.name, '홀') or #strings.contains(opt.name, '테이블')}"></i>
			
			<i class="icon ri-door-open-fill"
			   th:if="${#strings.contains(opt.name, '룸')}"></i>
			
			<i class="icon ri-goblet-fill"
			   th:if="${#strings.contains(opt.name, '바')}"></i>
			
			<i class="icon ri-microsoft-fill"
			   th:if="${#strings.contains(opt.name, '창가')}"></i>
			
			<i class="icon ri-table-line"
			   th:if="${!(#strings.contains(opt.name, '홀') or #strings.contains(opt.name, '테이블') or #strings.contains(opt.name,'룸') or #strings.contains(opt.name,'바') or #strings.contains(opt.name,'창가'))}"></i>
			   
			<i class="icon ri-cup-line"
			   th:if="${#strings.contains(opt.name, '테라스')}"></i>

            <div class="label"
                 th:text="${opt.available} ? ${opt.name} : ${opt.name + ' (만석)'}">홀</div>

          </label>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn" onclick="history.back()">취소</button>
        <button type="submit" id="submitBtn" class="btn btn-primary" disabled>예약 확정</button>
      </div>

    </form>
  </div>
</div>

<script>
  // ✅ 선택 전엔 "예약 확정" 비활성화
  const submitBtn = document.getElementById('submitBtn');

  function updateSubmitEnabled() {
    const checked = document.querySelector('input[type="radio"][name$="seqStoreTable"]:checked');
    submitBtn.disabled = !checked;
  }

  document.addEventListener('change', (e) => {
    if (e.target && e.target.matches('input[type="radio"][name$="seqStoreTable"]')) {
      updateSubmitEnabled();
    }
  });

  // 페이지 로드시에도 한번 체크(뒤로가기 등)
  updateSubmitEnabled();
</script>

</body>
</html>
