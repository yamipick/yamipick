<link rel="stylesheet" th:href="@{/css/common.css}">
<style>
    /* -------------------------------------------------------
       Warm Choco & Cream Theme Variables (통일)
    ------------------------------------------------------- */
    :root {
        --choco-dark: #3e2723;   /* 다크 초콜릿 (텍스트) */
        --choco-main: #6d4c41;   /* 메인 초콜릿 (주요 요소, 호버) */
        --choco-accent: #8d6e63; /* 강조 초콜릿 (버튼, 링크) */
        --cream-light: #fbe9e7;  /* 라이트 크림 (배경) */
        --cream-card: #ffffff;   /* 카드 크림 (카드 배경) */
        --radius-s: 8px;
        --radius-l: 20px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    
    /* -------------------------------------------------------
       Global Layout & Typography
    ------------------------------------------------------- */
    body { 
        font-family: 'Pretendard', 'Malgun Gothic', sans-serif; 
        background-color: var(--cream-light); 
        color: var(--choco-dark); 
        padding-top: 60px;
        margin: 0;
    }
    
    .wrap-container { 
        max-width: 500px; /* 크기 조정 */
        margin: 100px auto; 
        padding: 50px; 
        background: var(--cream-card); 
        border-radius: var(--radius-l); 
        box-shadow: var(--shadow); 
        text-align: center;
    }
    
    h1 { 
        color: var(--choco-main); 
        margin-bottom: 40px; /* 마진 증가 */
        font-weight: 900; 
        font-size: 32px;
        text-align: center;
    }
    
    /* 메인으로 돌아가기 버튼 (Primary Action) */
    a {
        text-decoration: none; 
        color: var(--cream-card); 
        background: var(--choco-accent); /* 강조색 */
        padding: 12px 30px; /* 크기 증가 */
        border-radius: var(--radius-s);
        font-weight: 700;
        display: inline-block;
        transition: background .15s ease;
        font-size: 16px;
    }
    a:hover {
        background: var(--choco-main); 
        text-decoration: none;
    }
</style>
<body>
    <div class="wrap-container">
        <h1>예약이 완료되었습니다 🎉</h1>
        <a href="/reservation/main">메인으로 돌아가기</a>
    </div>
</body>
</html>
