<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>날짜별 예약 리스트</title>
	<link rel="stylesheet" href="http://bit.ly/3WJ5ilK" />
	<style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: 40px auto;
        }
        h1 {
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border-bottom: 1px solid #ddd;
            padding: 8px 10px;
            text-align: center;
        }
        th {
            background-color: #f5f5f5;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .badge-wait {
            background-color: #fff3cd;
            color: #856404;
        }
        .badge-done {
            background-color: #d4edda;
            color: #155724;
        }
        .badge-cancel {
            background-color: #f8d7da;
            color: #721c24;
        }
        .badge-reject {
            background-color: #f8d7da;
            color: #721c24;
        }
        .badge-expired {
		    background-color: #b2bec3; /* 회색 계열 예시 */
		    color: #2d3436;
		}
        .badge-etc {
            background-color: #e2e3e5;
            color: #383d41;
        }

        .top-actions {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        a.button {
            padding: 6px 10px;
            border-radius: 6px;
            background: #007bff;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }
        a.button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<h1 th:text="${store.name} + ' - 날짜별 예약 리스트'">날짜별 예약 리스트</h1>

<a th:href="@{/store/dashboard}">← 매장 대시보드로</a>
&nbsp;|&nbsp;
<a th:href="@{/store/reservation/today}">당일 예약 리스트</a>

<hr/>

<!-- 날짜 선택 폼 (GET으로 같은 페이지 호출) -->
<form th:action="@{/store/reservation/list}" method="get" style="margin-bottom: 16px;">
    <label for="date">조회 날짜: </label>
    <input type="date"
           id="date"
           name="date"
           th:value="${#temporals.format(date, 'yyyy-MM-dd')}" />
    <button type="submit">조회</button>
</form>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>시간</th>
        <th>손님 닉네임</th>
        <th>인원</th>
        <th>테이블 타입</th>
        <th>상태</th>
        <th>취소 사유</th>
        <th>작업</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(reservations)}">
        <td colspan="7">해당 날짜에 예약이 없습니다.</td>
    </tr>

    <tr th:each="r : ${reservations}">
        <td th:text="${r.reserveTime}">18:00</td>
        <td th:text="${r.nickname}">손님닉네임</td>
        <td th:text="${r.peopleCount}">2</td>
        <td th:text="${r.tableTypeName}">창가석</td>

        <!-- 상태 뱃지: 너가 list에서 쓰던 방식에 맞춰서 작성 -->
        <td>
	            <span th:text="${r.status == '취소' ? '취소완료' : r.status}"
			          th:class="'badge ' + (${r.status} == '대기' ? 'badge-wait' :
			                                  (${r.status} == '완료' ? 'badge-done' :
			                                  (${r.status} == '취소' ? 'badge-cancel' : 
			                                  (${r.status} == '반려' ? 'badge-reject' :
			                                  (${r.status} == '만료' ? 'badge-expired' : 'badge-etc')))))">
			        예약 상태
			    </span>
	        </td>
        <td th:text="${r.cancelReason}">취소 사유</td>

        <td>
            <!-- 대기 상태일 때만 확정/취소 버튼 노출 -->
            <div th:if="${r.status == '대기'}">
                <form th:action="@{|/store/reservation/${r.seqReservation}/confirm|}"
                      method="post"
                      style="display:inline;">
                    <button type="submit">확정</button>
                </form>

                <form th:action="@{|/store/reservation/${r.seqReservation}/cancel|}"
                      method="post"
                      style="display:inline;"
                      onsubmit="return confirm('정말 이 예약을 반려하시겠습니까?');">
                    <input type="text" name="reason" placeholder="반려 사유" required />
                    <button type="submit">반려</button>
                </form>
            </div>

            <!-- 대기 아니면 버튼 대신 간단 표시 (선택) -->
            <div th:if="${r.status != '대기'}">
                처리 완료
            </div>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
