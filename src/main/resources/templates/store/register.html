<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>매장등록</title>
	<link rel="stylesheet" href="http://bit.ly/3WJ5ilK" />
	
	<!-- Kakao 지도 JS (★ JavaScript 키로 교체해야 함, REST 키 아님) -->
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=7ef5d0a137417135a1ff1e08560fcc98&libraries=services"></script>
</head>
<body>
<h1>매장 등록</h1>

<!-- 1) 매장 검색 영역 -->
<div>
    <input type="text" id="keyword" placeholder="매장 이름 또는 주소를 입력하세요">
    <button type="button" onclick="searchPlaces()">검색</button>
</div>

<div id="map" style="width: 600px; height: 400px; margin-top: 10px;"></div>

<!-- 검색 결과 리스트 -->
<ul id="search-result"></ul>

<hr>

<!-- 2) 선택된 매장 정보 + 추가 정보 입력 폼 -->
<form th:action="@{/store/register}" method="post">

    <!-- ★ Kakao에서 넘어온 값들을 담을 hidden / readonly 필드 -->
    <div>
        <label>장소 ID</label>
        <input type="text" id="kakaoPlaceId" name="kakaoPlaceId" readonly required>
    </div>

    <div>
        <label>매장 이름</label>
        <input type="text" id="storeName" name="name" readonly required>
    </div>

    <div>
        <label>주소</label>
        <input type="text" id="storeAddress" name="address" readonly required>
    </div>

    <div>
        <label>전화번호</label>
        <input type="text" id="storePhone" name="phone">
    </div>

    <hr>

    <!-- ========================= -->
<!-- 영업 시간 / 브레이크 타임 -->
<!-- ========================= -->
<h3>영업 시간 설정</h3>

<label>영업 시작 시간</label><br>
<select name="openTime">
    <option th:each="h : ${#numbers.sequence(0,23)}"
            th:value="${(h < 10 ? '0' + h : '' + h) + ':00'}"
            th:text="${(h < 10 ? '0' + h : '' + h) + ':00'}">
    </option>
</select>

<br><br>

<label>영업 종료 시간</label><br>
<select name="closeTime">
    <option th:each="h : ${#numbers.sequence(0,23)}"
            th:value="${(h < 10 ? '0' + h : '' + h) + ':00'}"
            th:text="${(h < 10 ? '0' + h : '' + h) + ':00'}">
    </option>
</select>

<br><br>

<label>브레이크 시작 시간</label><br>
<select name="breakStart">
    <option value="">— 없음 —</option>
    <option th:each="h : ${#numbers.sequence(0,23)}"
            th:value="${(h < 10 ? '0' + h : '' + h) + ':00'}"
            th:text="${(h < 10 ? '0' + h : '' + h) + ':00'}">
    </option>
</select>

<br><br>

<label>브레이크 종료 시간</label><br>
<select name="breakEnd">
    <option value="">— 없음 —</option>
    <option th:each="h : ${#numbers.sequence(0,23)}"
            th:value="${(h < 10 ? '0' + h : '' + h) + ':00'}"
            th:text="${(h < 10 ? '0' + h : '' + h) + ':00'}">
    </option>
</select>

<hr>

<!-- ========================= -->
<!-- 테이블 타입 설정 (프리셋 선택) -->
<!-- ========================= -->
<h3>테이블 타입 설정</h3>

<!-- 프리셋 선택 -->
<div id="tableTypePreset">
    <label><input type="checkbox" value="홀" onchange="toggleTableType(this)"> 홀</label>
    <label><input type="checkbox" value="바" onchange="toggleTableType(this)"> 바</label>
    <label><input type="checkbox" value="룸" onchange="toggleTableType(this)"> 룸</label>
    <label><input type="checkbox" value="테라스" onchange="toggleTableType(this)"> 테라스</label>
    <label><input type="checkbox" value="창가" onchange="toggleTableType(this)"> 창가</label>
</div>

<br>

<!-- 선택된 테이블 타입 입력 영역 -->
<div id="selectedTableTypes"></div>
	
	<div th:if="${errorMessage}" style="color:red;">
	    [[${errorMessage}]]
	</div>
	
    <button type="submit">매장 등록</button>
</form>

<script>
    function addTableTypeRow() {
        const container = document.getElementById('tableTypeContainer');
        const firstRow = container.querySelector('.table-type-row');
        const newRow = firstRow.cloneNode(true);

        // 새 줄의 input 값들 초기화
        newRow.querySelectorAll('input').forEach(input => {
            if (input.type === 'number') {
                input.value = input.name === 'tableCapacity' ? 2 : 1;
            } else {
                input.value = '';
            }
        });

        container.appendChild(newRow);
    }

    function removeTableTypeRow(btn) {
        const container = document.getElementById('tableTypeContainer');
        const rows = container.querySelectorAll('.table-type-row');

        if (rows.length === 1) {
            alert('최소 1개 이상의 테이블 타입이 필요합니다.');
            return;
        }

        btn.closest('.table-type-row').remove();
    }
</script>

<script>
    let map;
    let markers = [];
    let ps; // Places 서비스

    // 지도 초기화
    window.onload = function() {
        const container = document.getElementById('map');
        const options = {
            center: new kakao.maps.LatLng(37.5665, 126.9780), // 기본: 서울 시청 근처
            level: 5
        };
        map = new kakao.maps.Map(container, options);

        ps = new kakao.maps.services.Places();
    };

    // 검색 버튼 클릭 시 호출
    function searchPlaces() {
        const keyword = document.getElementById('keyword').value.trim();
        if (!keyword) {
            alert('검색어를 입력하세요.');
            return;
        }

        // 우리 서버로 AJAX 요청 -> KakaoSearchService 사용
        fetch('/api/store/search?q=' + encodeURIComponent(keyword))
            .then(res => res.json())
            .then(data => {
                // data = RestaurantDTO 리스트
                displayPlaces(data);
            })
            .catch(err => {
                console.error(err);
                alert('검색 중 오류가 발생했습니다.');
            });
    }

    // 검색 결과 표시 + 지도에 마커 찍기
    function displayPlaces(places) {
        // 이전 마커 제거
        markers.forEach(m => m.setMap(null));
        markers = [];

        const listEl = document.getElementById('search-result');
        listEl.innerHTML = '';

        if (!places || places.length === 0) {
            listEl.innerHTML = '<li>검색 결과가 없습니다.</li>';
            return;
        }

        const bounds = new kakao.maps.LatLngBounds();

        places.forEach((p, idx) => {
            const lat = parseFloat(p.y);
            const lng = parseFloat(p.x);
            const position = new kakao.maps.LatLng(lat, lng);

            const marker = new kakao.maps.Marker({
                map: map,
                position: position
            });
            markers.push(marker);
            bounds.extend(position);

            // 리스트 요소
            const li = document.createElement('li');
            li.style.cursor = 'pointer';
            li.innerText = `${p.name} / ${p.address} ${p.phone ? ' / ' + p.phone : ''}`;

            // 마커 & 리스트 클릭 시 해당 매장 선택
            const clickHandler = function() {
                selectPlace(p);
                map.panTo(position);
            };

            kakao.maps.event.addListener(marker, 'click', clickHandler);
            li.addEventListener('click', clickHandler);

            listEl.appendChild(li);
        });

        // 지도 범위 조정
        map.setBounds(bounds);
    }

    // 매장 선택 시 폼에 값 세팅
    function selectPlace(p) {
        document.getElementById('kakaoPlaceId').value = p.id;
        document.getElementById('storeName').value = p.name;
        document.getElementById('storeAddress').value = p.address;
        document.getElementById('storePhone').value = p.phone || '';

        alert('매장을 선택했습니다: ' + p.name);
    }
</script>
<script>
	document.querySelector("form").addEventListener("submit", function (e) {
	    const openTime = document.querySelector("input[name='openTime']").value;
	    const closeTime = document.querySelector("input[name='closeTime']").value;
	    const breakStart = document.querySelector("input[name='breakStart']").value;
	    const breakEnd = document.querySelector("input[name='breakEnd']").value;
	
	    if (!openTime || !closeTime) {
	        alert("영업 시작 / 종료 시간은 반드시 설정해야 합니다.");
	        e.preventDefault();
	        return;
	    }
	
	    // 브레이크 하나만 입력한 경우 차단
	    if ((breakStart && !breakEnd) || (!breakStart && breakEnd)) {
	        alert("브레이크 타임은 시작과 종료를 모두 입력해야 합니다.");
	        e.preventDefault();
	        return;
	    }
	});
</script>
<script>
function toggleTableType(checkbox) {
    const typeName = checkbox.value;
    const container = document.getElementById("selectedTableTypes");
    const rowId = "table-type-" + typeName;

    if (checkbox.checked) {
        if (document.getElementById(rowId)) return;

        const div = document.createElement("div");
        div.id = rowId;
        div.style.marginBottom = "8px";

        div.innerHTML = `
            <strong>${typeName}</strong>
            <input type="hidden" name="tableTypeName" value="${typeName}">

            <label> 테이블 최대 인원</label>
            <input type="number" name="tableCapacity" min="1" required style="width:80px;">

            <label> 테이블 개수</label>
            <input type="number" name="tableQuantity" min="1" required style="width:80px;">

            <button type="button" onclick="removeTableType('${typeName}')">삭제</button>
        `;

        container.appendChild(div);
    } else {
        removeTableType(typeName);
    }
}

function removeTableType(typeName) {
    const row = document.getElementById("table-type-" + typeName);
    if (row) row.remove();

    const checkbox = document.querySelector(
        `#tableTypePreset input[value="${typeName}"]`
    );
    if (checkbox) checkbox.checked = false;
}

// 최소 1개 선택 검증
document.querySelector("form").addEventListener("submit", function (e) {
    const count = document.querySelectorAll(
        "#selectedTableTypes input[name='tableTypeName']"
    ).length;

    if (count === 0) {
        alert("테이블 타입을 최소 1개 이상 선택해주세요.");
        e.preventDefault();
    }
});
</script>

</body>
</html>
