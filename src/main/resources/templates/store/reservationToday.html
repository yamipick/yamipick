<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>당일 예약 리스트</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<style>
        /* YamiPick Admin 공통 스타일 */
        :root {
            --color-primary: #ff3b1a;
            --color-accent: #6D4C41;
            --color-border: #eee;
            --color-shadow: 0 4px 12px rgba(0,0,0,.06);
            --border-radius: 12px;
        }
        body { font-family: 'Malgun Gothic', 'Dotum', sans-serif; background-color: #f8f8f8; color: #333; }
        .wrap-container { max-width: 960px; margin: 40px auto; padding: 30px; background: #fff; border-radius: 18px; box-shadow: var(--color-shadow); }
        h1 { color: var(--color-accent); border-bottom: 3px solid var(--color-primary); padding-bottom: 10px; margin-bottom: 25px; font-weight: 900; }
        p { margin-bottom: 20px; font-size: 16px; font-weight: 600; color: #777; }
        
        /* 링크 스타일 */
        a:not(.btn):not(.link-btn) { color: var(--color-primary); text-decoration: none; font-weight: 600; }
        a:hover:not(.btn):not(.link-btn) { text-decoration: underline; }

        /* 테이블 스타일 */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; }
        th, td { border: none; border-bottom: 1px solid var(--color-border); padding: 12px 10px; text-align: center; font-size: 14px; }
        th { background-color: #f5f5f5; color: #555; font-weight: 700; border-bottom: 2px solid #ddd; }
        tr:nth-child(even) { background-color: #fafafa; }
        tr:hover { background-color: #fffaf8; }
        
        /* 버튼/폼 스타일 */
        button[type="submit"] {
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            transition: all .15s ease;
            display: inline-block;
            text-decoration: none;
            margin-right: 5px;
            line-height: 1.4;
        }
        
        /* 확정 버튼 */
        form:first-child button[type="submit"] {
            background: var(--color-primary);
            color: #fff;
            border: none;
        }
        form:first-child button[type="submit"]:hover {
            background: #e63617;
        }
        
        /* 취소/반려 버튼 */
        form + form button[type="submit"] {
            background: #f0f0f0;
            color: #555;
            border: 1px solid #ddd;
        }
        form + form button[type="submit"]:hover {
            background: #e0e0e0;
        }
        
        input[type="text"][name="reason"] {
            width: 100px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }
        
    </style>
</head>
<body>
<div th:replace="~{common/header :: headerFragment}"></div>

<div class="wrap-container">

<h1 th:text="${store.name} + ' - 오늘 예약 현황'">당일 예약 리스트</h1>
<p>조회 날짜: <span th:text="${#temporals.format(date, 'yyyy년 MM월 dd일')}">2025년 12월 11일</span></p>

<table>
    <thead>
    <tr>
        <th>시간</th>
        <th>손님</th>
        <th>인원</th>
        <th>테이블 타입</th>
        <th>상태</th>
        <th>취소사유</th>
        <th>작업</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${reservations}">
        <td th:text="${r.reserveTime}">18:00</td>
        <td th:text="${r.nickname}">닉네임</td> <td th:text="${r.peopleCount}">4</td>
        <td th:text="${r.tableTypeName}">룸</td>
        <td th:text="${r.status}">대기</td>
        <td th:text="${r.cancelReason}">사유</td>
        <td style="white-space: nowrap;">
            <div th:if="${r.status == '대기'}">
                <form th:action="@{|/store/reservation/${r.seqReservation}/confirm|}" method="post" style="display:inline;">
                    <button type="submit">확정</button>
                </form>
                <form th:action="@{|/store/reservation/${r.seqReservation}/cancel|}" method="post" style="display:inline; margin-left: 5px;" onsubmit="return confirm('정말 이 예약을 반려하시겠습니까?');">
                    <input type="text" name="reason" placeholder="반려 사유" required>
                    <button type="submit">반려</button>
                </form>
            </div>
            <div th:if="${r.status != '대기'}">
                처리 완료
            </div>
        </td>
    </tr>
    </tbody>
</table>

<div style="margin-top: 20px;">
    <a href="/store/dashboard">대시보드로 돌아가기</a>
</div>

</div>
</body>
</html>
